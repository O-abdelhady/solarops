// ---------------------------------------------------------------- small pieces
function Pill({ tone = "neutral", children, title }) { return <span className={"pill " + tone} title={title}>{children}</span>; }
const LIFECYCLE_TONE = { Active: "warn", Recovered: "good", Historical: "neutral" };
const LIFECYCLE_TIP = { Active: "Still present in the latest valid data, or recovery not yet confirmed", Recovered: "Recovered: confirmed by later valid measurements", Historical: "Recovered before the selected period" };
function LifecyclePill({ ev }) { return ev && ev.lifecycle ? <Pill tone={LIFECYCLE_TONE[ev.lifecycle]} title={LIFECYCLE_TIP[ev.lifecycle]}>{ev.lifecycle}</Pill> : null; }
// Task closed but the data still shows the fault: maintenance state and physical state disagree.
function faultPersists(task, ev) { return !!(task && ev && task.status === "Resolved" && ev.kind === "production" && !ev.recovered); }
function PersistsPill() { return <Pill tone="crit" title="Work order is Resolved, but production data still shows the fault">Task resolved, fault still present</Pill>; }
function Icon({ name }) {
  const p = { grid: "M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z", site: "M3 11l9-8 9 8M5 10v10h14V10", wrench: "M14.7 6.3a4 4 0 0 0 5 5L13 18a3 3 0 0 1-4.2 0l-1-1a3 3 0 0 1 0-4.2zM3 21l4-4", sun: "M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" }[name];
  return <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={p} /></svg>;
}
function Kpi({ label, value, sub, tone }) {
  return <div className="kpi"><div className="eyebrow">{label}</div><div className={"v " + (tone || "")}>{value}</div>{sub && <div className="s">{sub}</div>}</div>;
}
function Overlay({ onClose, children, wide, drawer }) {
  useEffect(() => { const k = (e) => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [onClose]);
  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={drawer ? "drawer" : "dialog" + (wide ? " wide" : "")} role="dialog" aria-modal="true">{children}</div>
    </div>
  );
}
function DialogHead({ title, sub, onClose }) {
  return <div className="dialog-head"><div><h2>{title}</h2>{sub && <p className="muted small">{sub}</p>}</div><button className="x" onClick={onClose} aria-label="Close">×</button></div>;
}
function Toasts({ items }) { return <div className="toasts">{items.map((t) => <div className="toast" key={t.id}>{t.text}</div>)}</div>; }

// ---------------------------------------------------------------- chart (hand-rolled SVG, responsive, hover tooltip)
// series: [{date, actual, expected, status, missingSites}], bands: [{dates:[...], tone, label}]
function EnergyChart({ series, bands = [], height = 240, unit = "kWh" }) {
  const wrap = useRef(null);
  const width = useWidth(wrap);
  const [hover, setHover] = useState(null);
  const pad = { l: 52, r: 12, t: 12, b: 28 };
  const iw = width - pad.l - pad.r, ih = height - pad.t - pad.b;
  const n = series.length;
  const maxY = Math.max(1, ...series.map((d) => Math.max(d.actual || 0, d.expected || 0))) * 1.08;
  const x = (i) => pad.l + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = (v) => pad.t + ih - (v / maxY) * ih;
  const path = (key) => {
    let d = "", pen = false;
    series.forEach((p, i) => { const v = p[key]; if (v == null) { pen = false; return; } d += (pen ? " L" : " M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
    return d;
  };
  const singles = (key) => series.map((p, i) => (p[key] != null && (i === 0 || series[i - 1][key] == null) && (i === n - 1 || series[i + 1][key] == null)) ? i : -1).filter((i) => i >= 0);
  const ticks = 4;
  const yTicks = Array.from({ length: ticks + 1 }, (_, i) => (maxY / ticks) * i);
  const step = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(iw / 80))));
  const half = n > 1 ? (iw / (n - 1)) / 2 : iw / 2;
  const onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const px = e.clientX - rect.left;
    if (!n) return;
    const i = Math.round(((px - pad.l) / iw) * (n - 1));
    setHover(Math.max(0, Math.min(n - 1, i)));
  };
  const indexOf = new Map(series.map((p, i) => [p.date, i]));
  const h = hover != null ? series[hover] : null;
  const tipLeft = h ? Math.min(Math.max(0, x(hover) - 90), width - 190) : 0;
  return (
    <div className="chart" ref={wrap}>
      <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} onMouseMove={onMove} onMouseLeave={() => setHover(null)} onTouchStart={(e) => { const t = e.touches[0]; onMove({ currentTarget: e.currentTarget, clientX: t.clientX }); }} onTouchMove={(e) => { const t = e.touches[0]; onMove({ currentTarget: e.currentTarget, clientX: t.clientX }); }}>
        {yTicks.map((v, i) => <g key={i}><line x1={pad.l} x2={width - pad.r} y1={y(v)} y2={y(v)} stroke="var(--line)" /><text x={pad.l - 8} y={y(v) + 3} textAnchor="end" fontSize="10" fill="var(--ink-3)" fontFamily="var(--f-mono)">{v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : Math.round(v)}</text></g>)}
        {bands.map((b, bi) => b.dates.map((d) => indexOf.has(d) ? indexOf.get(d) : null).filter((i) => i != null).map((i) => (
          <rect key={bi + ":" + i} x={x(i) - half} y={pad.t} width={half * 2} height={ih} fill={b.tone === "crit" ? "var(--band-out)" : b.tone === "warn" ? "var(--band-under)" : "var(--band-data)"} />
        )))}
        {series.map((p, i) => (p.status === "missing_actual" || p.status === "no_record" || p.status === "missing_baseline") ? (
          <g key={"m" + i}><rect x={x(i) - half} y={pad.t} width={half * 2} height={ih} fill="var(--band-data)" /><line x1={x(i)} x2={x(i)} y1={pad.t} y2={pad.t + ih} stroke="var(--info)" strokeDasharray="2 3" strokeWidth="1" opacity="0.6" /></g>
        ) : null)}
        <path d={path("expected")} fill="none" stroke="var(--expected)" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" />
        <path d={path("actual")} fill="none" stroke="var(--actual)" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round" />
        {singles("actual").map((i) => <circle key={"sa" + i} cx={x(i)} cy={y(series[i].actual)} r="3" fill="var(--actual)" />)}
        {singles("expected").map((i) => <circle key={"se" + i} cx={x(i)} cy={y(series[i].expected)} r="3" fill="var(--expected)" />)}
        {series.map((p, i) => (i % step === 0 || i === n - 1) ? <text key={"t" + i} x={x(i)} y={height - 8} textAnchor={i === 0 ? "start" : i === n - 1 ? "end" : "middle"} fontSize="10" fill="var(--ink-3)">{C.fmtDate(p.date)}</text> : null)}
        <line x1={pad.l} x2={width - pad.r} y1={pad.t + ih} y2={pad.t + ih} stroke="var(--line-2)" />
        {h && <g><line x1={x(hover)} x2={x(hover)} y1={pad.t} y2={pad.t + ih} stroke="var(--ink)" strokeWidth="1" opacity="0.5" />
          {h.actual != null && <circle cx={x(hover)} cy={y(h.actual)} r="4.5" fill="var(--actual)" stroke="#fff" strokeWidth="2" />}
          {h.expected != null && <circle cx={x(hover)} cy={y(h.expected)} r="4.5" fill="var(--expected)" stroke="#fff" strokeWidth="2" />}</g>}
      </svg>
      {h && (
        <div className="tip" style={{ left: tipLeft }}>
          <div style={{ fontWeight: 600 }}>{C.fmtDateLong(h.date)}</div>
          <div>Actual: {h.actual == null ? "no measurement" : num(h.actual, 1) + " " + unit}</div>
          <div>Expected: {h.expected == null ? "no baseline" : num(h.expected, 1) + " " + unit}</div>
          {h.actual != null && h.expected != null && h.expected > 0 && <div>EPI: {(h.actual / h.expected * 100).toFixed(1)}%</div>}
          {h.missingSites > 0 && <div>{h.missingSites} site{h.missingSites > 1 ? "s" : ""} without valid data</div>}
          {h.flag && <div style={{ color: "#fcd58b" }}>{h.flag}</div>}
        </div>
      )}
      <div className="legend">
        <span><i className="sw" style={{ borderColor: "var(--actual)" }} />Actual generation</span>
        <span><i className="sw dash" style={{ borderColor: "var(--expected)" }} />Expected baseline</span>
        <span><i className="sw box" style={{ background: "var(--band-under)", outline: "1px solid var(--warn)" }} />Underperformance</span>
        <span><i className="sw box" style={{ background: "var(--band-out)", outline: "1px solid var(--crit)" }} />Possible outage</span>
        <span><i className="sw box" style={{ background: "var(--band-data)", outline: "1px solid var(--info)" }} />Missing data (gap, never zero)</span>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Screen A: Portfolio Command Center
function Portfolio({ R, records, tasks, go, openCreate }) {
  const [q, setQ] = useState("");
  const [sort, setSort] = useState({ key: "rank", dir: 1 });
  const sites = Object.values(R.perSite);
  const flagged = sites.filter((p) => p.status.status === "Review");
  const dataIssueSites = sites.filter((p) => p.status.status === "Data Issue" || p.status.status === "Insufficient data");
  const eligible = sites.reduce((s, p) => s + p.metrics.eligibleDays, 0);
  const valid = sites.reduce((s, p) => s + p.metrics.validDays, 0);
  const coverage = eligible ? (valid / eligible) * 100 : null;

  const series = useMemo(() => R.dates.map((d) => {
    let a = 0, e = 0, any = false, missing = 0;
    sites.forEach((p) => { const day = p.metrics.days.find((x) => x.date === d); if (day && day.status === "valid") { a += day.actual; e += day.expected; any = true; } else if (day) missing++; });
    return { date: d, actual: any ? a : null, expected: any ? e : null, status: any ? "valid" : "missing_actual", missingSites: missing };
  }), [R]);

  const rows = sites.map((p) => ({
    id: p.site.id, name: p.site.name, city: p.site.city, cap: p.site.capacityKwp, epi: p.metrics.epi, actual: p.metrics.actualKwh, expected: p.metrics.expectedKwh,
    value: p.metrics.shortfallValue, shortfall: p.metrics.shortfallKwh, coverage: p.metrics.coverage, status: p.status.status, rank: p.rank, last: p.metrics.lastMeasurement,
  })).filter((r) => !q || (r.name + " " + r.id + " " + r.city + " " + r.status).toLowerCase().includes(q.toLowerCase()));
  rows.sort((a, b) => {
    const k = sort.key; let va = a[k], vb = b[k];
    if (k === "rank") { va = va == null ? 99 : va; vb = vb == null ? 99 : vb; }
    if (va == null) return 1; if (vb == null) return -1;
    if (typeof va === "string") return va.localeCompare(vb) * sort.dir;
    return (va - vb) * sort.dir;
  });
  const th = (key, label, right) => <th className={"sortable" + (right ? " r" : "")} onClick={() => setSort((s) => ({ key, dir: s.key === key ? -s.dir : (key === "name" || key === "status" || key === "rank" ? 1 : -1) }))} aria-sort={sort.key === key ? (sort.dir === 1 ? "ascending" : "descending") : "none"}>{label}{sort.key === key ? (sort.dir === 1 ? " ↑" : " ↓") : ""}</th>;

  return (
    <div className="stack">
      <div className="kpis">
        <Kpi label="Portfolio EPI" value={pct(R.portfolio.epi)} sub="Σ actual / Σ expected, valid days" tone={R.portfolio.epi != null && R.portfolio.epi < 85 ? "warn" : ""} />
        <Kpi label="Actual generation" value={num(R.portfolio.actualKwh / 1000, 1) + " MWh"} sub={`vs ${num(R.portfolio.expectedKwh / 1000, 1)} MWh expected`} />
        <Kpi label="Est. shortfall value" value={C.money(R.portfolio.shortfallValue)} sub={sites.some((p) => p.site.energyValue != null) ? `${num(R.portfolio.shortfallKwh)} kWh at each site's rate (default $${R.settings.energyValue.toFixed(2)}/kWh), estimate` : `${num(R.portfolio.shortfallKwh)} kWh at $${R.settings.energyValue.toFixed(2)}/kWh, estimate`} tone={R.portfolio.shortfallValue > 500 ? "warn" : ""} />
        <Kpi label="Sites flagged" value={String(flagged.length)} sub={`of ${sites.length} sites, active anomaly`} tone={flagged.length ? "crit" : ""} />
        <Kpi label="Data issues" value={String(dataIssueSites.length)} sub={`portfolio coverage ${pct(coverage)}`} tone={dataIssueSites.length ? "warn" : ""} />
        <Kpi label="Open investigations" value={String(R.openTasks)} sub={`${tasks.filter((t) => t.status === "Resolved").length} resolved`} />
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-head"><h2>Portfolio generation, actual vs expected</h2><span className="small faint">Daily totals across sites with valid data. {R.dates.length} days to {C.fmtDate(R.dates[R.dates.length - 1])}</span></div>
          <EnergyChart series={series} />
        </div>
        <div className="card">
          <div className="card-head"><h2>Attention required</h2><span className="small faint">{R.ranked.length} ranked</span></div>
          {R.ranked.length === 0 && <div className="empty">No active production anomalies in this period.</div>}
          <div className="attn">
            {R.ranked.map((ev) => {
              const site = R.perSite[ev.siteId].site;
              const task = C.taskForEvent(ev.id, tasks);
              return (
                <div className="attn-item" key={ev.id}>
                  <Pill tone="rank">#{ev.rank}</Pill>
                  <div>
                    <div className="title">{site.name} <span className="faint small mono">{site.id}</span>{faultPersists(task, ev) && <> <PersistsPill /></>}</div>
                    <div className="meta"><Pill tone={TONE_BY_RULE[ev.rule]}>{ev.rule === "possible_outage" ? "Possible outage" : "Underperformance"}</Pill><span>{ev.periodDays}d{ev.ongoing ? ", ongoing" : ""}</span><span>EPI {pct(ev.periodEpi)}</span>{task && <span className="mono">{task.id}</span>}</div>
                  </div>
                  <div style={{ display: "grid", gap: 6, justifyItems: "end" }}>
                    <div className="money">{C.money(ev.periodValue)}</div>
                    <button className="btn sm primary" onClick={() => go("site", site.id)}>Investigate</button>
                  </div>
                </div>
              );
            })}
          </div>
          {R.dataIssues.length > 0 && <p className="small faint" style={{ marginTop: 12 }}>{R.dataIssues.length} data gap{R.dataIssues.length > 1 ? "s" : ""} in this period {R.dataIssues.length > 1 ? "are" : "is"} listed in the table as Data Issue. Data gaps are not ranked by value because no loss is estimated for them.</p>}
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <h2>Sites</h2>
          <input type="search" placeholder="Search site, city, status" value={q} onChange={(e) => setQ(e.target.value)} style={{ width: 240 }} aria-label="Search sites" />
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr>{th("name", "Site")}{th("cap", "kWp", true)}{th("epi", "EPI", true)}{th("actual", "Actual kWh", true)}{th("value", "Shortfall $", true)}{th("coverage", "Coverage", true)}{th("status", "Status")}{th("rank", "Priority")}</tr></thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.id} className="row-link" tabIndex={0} onClick={() => go("site", r.id)} onKeyDown={(e) => { if (e.key === "Enter") go("site", r.id); }}>
                  <td><div className="cell-title">{r.name}</div><div className="cell-sub mono">{r.id} · {r.city}</div></td>
                  <td className="r num">{r.cap}</td>
                  <td className="r mono" style={{ color: r.epi != null && r.epi < 85 ? "var(--crit)" : "inherit" }}>{pct(r.epi)}</td>
                  <td className="r mono">{num(r.actual)}</td>
                  <td className="r mono">{C.money(r.value)}</td>
                  <td className="r mono" style={{ color: r.coverage != null && r.coverage < 100 ? "var(--info)" : "inherit" }}>{pct(r.coverage)}</td>
                  <td><Pill tone={STATUS_TONE[r.status]}>{r.status}</Pill></td>
                  <td>{r.rank ? <Pill tone="rank">#{r.rank}</Pill> : <span className="faint small">none</span>}</td>
                </tr>
              ))}
              {rows.length === 0 && <tr><td colSpan={8}><div className="empty">No sites match "{q}".</div></td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Screen B: Site Intelligence
function SiteView({ R, siteId, tasks, go, openCreate, openTask, reopenTask }) {
  const ps = R.perSite[siteId];
  if (!ps) return <div className="empty">Unknown site {siteId}.</div>;
  const { site, metrics: m, insight, status, primaryEvent } = ps;
  const series = m.days.map((d) => Object.assign({}, d, { flag: ps.periodEvents.find((e) => e.kind === "production" && e.dates.includes(d.date)) ? ps.periodEvents.find((e) => e.kind === "production" && e.dates.includes(d.date)).label : null }));
  const bands = ps.periodEvents.filter((e) => e.kind === "production").map((e) => ({ dates: e.dates, tone: TONE_BY_RULE[e.rule], label: e.label }));
  const openTaskFor = primaryEvent ? C.taskForEvent(primaryEvent.id, tasks) : null;
  const persists = faultPersists(openTaskFor, primaryEvent);
  const siteTasks = tasks.filter((t) => t.siteId === siteId);
  const tone = status.status === "Review" ? (primaryEvent && primaryEvent.rule === "possible_outage" ? "crit" : "warn") : STATUS_TONE[status.status];
  return (
    <div className="stack">
      <div className="site-head">
        <div>
          <div className="eyebrow">{site.type} · {site.city}, {site.state}</div>
          <h1>{site.name} <span className="faint mono" style={{ fontSize: "0.9rem", fontWeight: 400 }}>{site.id}</span></h1>
          <div className="chips" style={{ marginTop: 6 }}><span>{site.capacityKwp} kWp DC</span><span>{site.inverter}</span><span>Commissioned {C.fmtDateLong(site.commissioned)}</span><span>Last valid measurement {m.lastMeasurement ? C.fmtDateLong(m.lastMeasurement) : "none"}</span></div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <Pill tone={STATUS_TONE[status.status]}>{status.status}</Pill>
          {ps.rank && <Pill tone="rank">Priority #{ps.rank}</Pill>}
          {openTaskFor ? (persists ? <button className="btn primary" onClick={() => reopenTask(openTaskFor.id)}>Reopen {openTaskFor.id}</button> : <button className="btn" onClick={() => openTask(openTaskFor.id)}>Open {openTaskFor.id}</button>)
            : <button className="btn primary" onClick={() => openCreate(siteId, primaryEvent ? primaryEvent.id : null)}>Create investigation</button>}
        </div>
      </div>

      {persists && <div className="callout crit"><strong>{openTaskFor.id} is marked Resolved, but the fault is still present in the production data.</strong> The site stays flagged until {C.RULES.RECOVERY_MIN_DAYS} valid days at or above {C.RULES.UNDERPERF_EPI * 100}% of expected confirm recovery. Reopen the investigation to continue work on it.</div>}
      <div className="kpis">
        <Kpi label="EPI" value={pct(m.epi)} sub="actual / expected, valid days" tone={m.epi != null && m.epi < 85 ? "crit" : ""} />
        <Kpi label="Actual" value={num(m.actualKwh) + " kWh"} sub={`${m.validDays} valid days`} />
        <Kpi label="Expected" value={num(m.expectedKwh) + " kWh"} sub="supplied baseline" />
        <Kpi label="Shortfall" value={num(m.shortfallKwh) + " kWh"} sub="Σ max(0, expected − actual)" />
        <Kpi label="Est. value" value={C.money(m.shortfallValue)} sub={`at $${m.energyValue.toFixed(2)}/kWh${site.energyValue != null ? " (site rate)" : ""}, estimate`} tone={m.shortfallValue > 100 ? "warn" : ""} />
        <Kpi label="Coverage" value={pct(m.coverage)} sub={`${m.validDays}/${m.eligibleDays} days, ${m.missingActual + m.missingBaseline + m.noRecord} missing`} tone={m.coverage != null && m.coverage < 100 ? "warn" : ""} />
      </div>

      <div className="card">
        <div className="card-head"><h2>Daily generation, actual vs expected</h2><span className="small faint">{R.dates.length}-day window. Shaded days are rule hits; gaps are missing data.</span></div>
        <EnergyChart series={series} bands={bands} />
      </div>

      <div className="grid-2">
        <div className={"card insight " + tone}>
          <div className="card-head"><div><div className="eyebrow">Intelligence panel</div><h2>{insight.headline}</h2></div>{primaryEvent && <Pill tone={TONE_BY_RULE[primaryEvent.rule]}>{primaryEvent.rule.replace(/_/g, " ")}</Pill>}</div>
          <div className="insight-row"><div className="k">Observation</div><div className="v">{insight.observation}</div></div>
          <div className="insight-row"><div className="k">Evidence</div><div className="v">{insight.evidence}</div></div>
          <div className="insight-row"><div className="k">Financial exposure</div><div className="v">{insight.exposure}</div></div>
          <div className="insight-row"><div className="k">Possible explanations</div><div className="v">{insight.explanations.length ? <ul>{insight.explanations.map((x, i) => <li key={i}>{x}</li>)}</ul> : <span className="faint">None required.</span>}</div></div>
          <div className="insight-row"><div className="k">Recommended next step</div><div className="v" style={{ fontWeight: 500 }}>{insight.nextStep}</div></div>
          <div className="insight-row"><div className="k">Data limitations</div><div className="v"><ul>{insight.dataLimits.map((x, i) => <li key={i} className="muted">{x}</li>)}</ul></div></div>
          {primaryEvent && primaryEvent.rankReason && <div className="callout info" style={{ marginTop: 10 }}><strong>Why this rank: </strong>{primaryEvent.rankReason}</div>}
        </div>

        <div className="stack">
          <div className="card">
            <div className="card-head"><h3>Events in this period</h3><span className="small faint">{ps.periodEvents.length}{ps.historicalEvents.length ? ` + ${ps.historicalEvents.length} historical` : ""}</span></div>
            {ps.periodEvents.length === 0 && <div className="empty">No rule triggered in this period.</div>}
            <div className="attn">
              {ps.periodEvents.map((e) => {
                const t = tasks.find((x) => x.anomalyId === e.id);
                return (
                  <div className="attn-item" key={e.id} style={{ gridTemplateColumns: "minmax(0,1fr) auto" }}>
                    <div>
                      <div className="title"><Pill tone={TONE_BY_RULE[e.rule]}>{e.rule.replace(/_/g, " ")}</Pill> <LifecyclePill ev={e} /> {t && <Pill tone={TASK_TONE[t.status]}>{t.id} · {t.status}</Pill>} {faultPersists(t, e) && <PersistsPill />}</div>
                      <div className="meta"><span>{C.fmtDate(e.start)} to {C.fmtDate(e.end)}{e.ongoing ? " (ongoing)" : ""}</span>{e.recoveredOn && <span>recovered {C.fmtDate(e.recoveredOn)}</span>}<span>{e.periodDays} day{e.periodDays === 1 ? "" : "s"} in window</span>{e.kind === "production" && <span>EPI {pct(e.periodEpi)}</span>}{e.kind === "data" && <span>{e.missingActual} missing readings</span>}</div>
                    </div>
                    <div style={{ display: "grid", gap: 6, justifyItems: "end" }}>
                      {e.kind === "production" ? <div className="money">{C.money(e.periodValue)}</div> : <div className="faint small">no loss estimated</div>}
                      {t ? (faultPersists(t, e) ? <button className="btn sm primary" onClick={() => reopenTask(t.id)}>Reopen</button> : <button className="btn sm" onClick={() => openTask(t.id)}>View</button>) : <button className="btn sm" onClick={() => openCreate(siteId, e.id)}>Investigate</button>}
                    </div>
                  </div>
                );
              })}
            </div>
            {ps.historicalEvents.length > 0 && (
              <div style={{ marginTop: 14 }}>
                <div className="eyebrow" style={{ marginBottom: 6 }}>Historical (recovered before this period)</div>
                <div className="attn">
                  {ps.historicalEvents.map((e) => {
                    const t = C.taskForEvent(e.id, tasks);
                    return (
                      <div className="attn-item" key={e.id} style={{ gridTemplateColumns: "minmax(0,1fr) auto" }}>
                        <div>
                          <div className="title"><Pill tone={TONE_BY_RULE[e.rule]}>{e.rule.replace(/_/g, " ")}</Pill> <LifecyclePill ev={e} /> {t && <Pill tone={TASK_TONE[t.status]}>{t.id} · {t.status}</Pill>}</div>
                          <div className="meta"><span>{C.fmtDate(e.start)} to {C.fmtDate(e.end)}</span><span>recovered {C.fmtDate(e.recoveredOn)}</span>{e.kind === "production" && <span>EPI {pct(e.epi)}, {num(e.shortfallKwh)} kWh short</span>}</div>
                        </div>
                        {t && <button className="btn sm" onClick={() => openTask(t.id)}>View</button>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
          <div className="card">
            <div className="card-head"><h3>Investigations at this site</h3><span className="small faint">{siteTasks.length}</span></div>
            {siteTasks.length === 0 && <div className="empty">None yet.</div>}
            <div className="attn">
              {siteTasks.map((t) => (
                <div className="attn-item" key={t.id} style={{ gridTemplateColumns: "minmax(0,1fr) auto" }}>
                  <div><div className="title"><span className="mono">{t.id}</span> {t.title}</div><div className="meta"><Pill tone={TASK_TONE[t.status]}>{t.status}</Pill><Pill tone={PRIORITY_TONE[t.priority]}>{t.priority}</Pill><span>{t.assignee}</span></div></div>
                  <button className="btn sm" onClick={() => openTask(t.id)}>Open</button>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <h3 style={{ marginBottom: 8 }}>Rules applied</h3>
            <dl className="kv">
              <dt>Rule 1</dt><dd>Sustained underperformance: EPI below {C.RULES.UNDERPERF_EPI * 100}% for {C.RULES.UNDERPERF_MIN_DAYS}+ consecutive eligible days (expected above {C.RULES.UNDERPERF_MIN_YIELD} kWh/kWp).</dd>
              <dt>Rule 2</dt><dd>Possible outage: actual at most {C.RULES.OUTAGE_MAX_RATIO * 100}% of expected when expected is at least {C.RULES.OUTAGE_MIN_YIELD} kWh/kWp.</dd>
              <dt>Rule 3</dt><dd>Missing data: flagged, excluded from all figures, never zero-filled, no loss estimated.</dd>
              <dt>Rule 4</dt><dd>Healthy: no rule hit and full coverage.</dd>
              <dt>Rule 5</dt><dd>Insufficient data: coverage below {C.RULES.INSUFFICIENT_COVERAGE}%.</dd>
            </dl>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Screen C: Maintenance Operations
function Maintenance({ R, tasks, go, openCreate, openTask, updateTask, reopenTask }) {
  const [tab, setTab] = useState("All");
  const [q, setQ] = useState("");
  const tabs = ["All", ...C.STATUSES];
  const list = tasks.filter((t) => (tab === "All" ? t.status !== "Resolved" : t.status === tab)).filter((t) => !q || (t.id + " " + t.title + " " + t.siteId + " " + t.assignee).toLowerCase().includes(q.toLowerCase()));
  const order = { Critical: 0, High: 1, Medium: 2, Low: 3 };
  list.sort((a, b) => (order[a.priority] - order[b.priority]) || (a.createdAt < b.createdAt ? 1 : -1));
  const count = (s) => tasks.filter((t) => (s === "All" ? t.status !== "Resolved" : t.status === s)).length;
  return (
    <div className="stack">
      <div className="card">
        <div className="card-head"><div><h2>Ranked maintenance queue</h2><p className="small faint">Active production anomalies (not yet recovered in the data) in the selected period, ranked by estimated shortfall value. Task status does not remove an item; recovery in the data does. Data gaps are not ranked (no loss estimated).</p></div><span className="small faint">{R.ranked.length} item{R.ranked.length === 1 ? "" : "s"}</span></div>
        {R.ranked.length === 0 && <div className="empty">Queue is empty for this period.</div>}
        <div className="attn">
          {R.ranked.map((ev) => {
            const site = R.perSite[ev.siteId].site;
            const task = C.taskForEvent(ev.id, tasks);
            return (
              <div className="attn-item" key={ev.id}>
                <Pill tone="rank">#{ev.rank}</Pill>
                <div>
                  <div className="title">{site.name} <span className="faint small mono">{site.id}</span> <Pill tone={TONE_BY_RULE[ev.rule]}>{ev.rule.replace(/_/g, " ")}</Pill>{faultPersists(task, ev) && <> <PersistsPill /></>}</div>
                  <div className="meta"><span>{C.fmtDate(ev.start)}{ev.ongoing ? " to now" : " to " + C.fmtDate(ev.end)}</span><span>{ev.periodDays}d in window</span><span>{num(ev.periodShortfall)} kWh short</span><span>EPI {pct(ev.periodEpi)}</span></div>
                  <details className="small" style={{ marginTop: 4 }}><summary className="muted" style={{ cursor: "pointer" }}>Why this rank</summary><p className="muted" style={{ marginTop: 4 }}>{ev.rankReason}</p></details>
                </div>
                <div style={{ display: "grid", gap: 6, justifyItems: "end" }}>
                  <div className="money">{C.money(ev.periodValue)}</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button className="btn sm" onClick={() => go("site", site.id)}>Site</button>
                    {task ? (faultPersists(task, ev) ? <button className="btn sm primary" onClick={() => reopenTask(task.id)}>Reopen {task.id}</button> : <button className="btn sm" onClick={() => openTask(task.id)}>{task.id}</button>) : <button className="btn sm primary" onClick={() => openCreate(site.id, ev.id)}>Create task</button>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <h2>Investigations and work orders</h2>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input type="search" placeholder="Search tasks" value={q} onChange={(e) => setQ(e.target.value)} style={{ width: 200 }} aria-label="Search tasks" />
            <button className="btn primary" onClick={() => openCreate(null, null)}>New task</button>
          </div>
        </div>
        <div className="tabs" role="tablist" style={{ marginBottom: 10 }}>{tabs.map((s) => <button key={s} role="tab" aria-selected={tab === s} onClick={() => setTab(s)}>{s === "All" ? "Active" : s}<span className="count">{count(s)}</span></button>)}</div>
        {list.length === 0 && <div className="empty">No tasks here.</div>}
        {list.length > 0 && (
          <div className="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Task</th><th>Site</th><th>Priority</th><th>Status</th><th>Assignee</th><th className="r">Shortfall</th><th className="r">Est. cost</th><th>Created</th></tr></thead>
              <tbody>
                {list.map((t) => (
                  <tr key={t.id} className="row-link" tabIndex={0} onClick={() => openTask(t.id)} onKeyDown={(e) => { if (e.key === "Enter") openTask(t.id); }}>
                    <td className="mono">{t.id}</td>
                    <td><div className="cell-title">{t.title}</div>{t.notes.length > 0 && <div className="cell-sub">{t.notes.length} note{t.notes.length > 1 ? "s" : ""}</div>}{faultPersists(t, R.perSite[t.siteId] && R.perSite[t.siteId].events.find((e) => e.id === t.anomalyId)) && <div style={{ marginTop: 4 }}><PersistsPill /></div>}</td>
                    <td className="mono">{t.siteId}</td>
                    <td><Pill tone={PRIORITY_TONE[t.priority]}>{t.priority}</Pill></td>
                    <td><select value={t.status} onChange={(e) => updateTask(t.id, { status: e.target.value })} onClick={(e) => e.stopPropagation()} aria-label="Status" style={{ width: "auto", padding: "3px 6px", fontSize: "0.8rem" }}>{C.STATUSES.map((s) => <option key={s}>{s}</option>)}</select></td>
                    <td className="small">{t.assignee}</td>
                    <td className="r mono">{t.shortfallKwh != null ? num(t.shortfallKwh) + " kWh" : "n/a"}</td>
                    <td className="r mono">{t.estimatedCost != null && t.estimatedCost !== "" ? C.money(t.estimatedCost) : "n/a"}</td>
                    <td className="small mono">{C.fmtDate(t.createdAt)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- Create Investigation dialog
function CreateDialog({ R, tasks, siteId: initialSite, anomalyId: initialAnomaly, onClose, onCreate }) {
  const team = useContext(TeamCtx);
  const siteList = Object.values(R.perSite).map((p) => p.site);
  const [siteId, setSiteId] = useState(initialSite || (siteList[0] && siteList[0].id));
  const ps = R.perSite[siteId];
  const options = ps.periodEvents.filter((e) => C.canCreateTask(e.id, tasks));
  const [anomalyId, setAnomalyId] = useState(initialAnomaly && options.some((e) => e.id === initialAnomaly) ? initialAnomaly : (options[0] ? options[0].id : ""));
  const ev = options.find((e) => e.id === anomalyId) || null;
  const build = (ev) => {
    if (!ev) return { title: `Manual check at ${ps.site.name}`, description: "", priority: "Medium" };
    const ins = C.buildInsight({ site: ps.site, metrics: ps.metrics, event: ev, status: ps.status, settings: R.settings });
    return { title: `${ev.label.split(",")[0]} at ${ps.site.name}`, description: `${ins.observation}\n\n${ins.evidence}`, priority: C.defaultPriority(ev) };
  };
  const [form, setForm] = useState(() => Object.assign({ assignee: team[0], estimatedCost: "", note: "" }, build(ev)));
  useEffect(() => { setForm((f) => Object.assign({}, f, build(ev))); }, [anomalyId, siteId]);
  const set = (k) => (e) => setForm((f) => Object.assign({}, f, { [k]: e.target.value }));
  const submit = (e) => {
    e.preventDefault();
    if (!form.title.trim()) return;
    onCreate({
      siteId, anomalyId: ev ? ev.id : null, title: form.title.trim(), description: form.description, priority: form.priority, assignee: form.assignee,
      estimatedCost: form.estimatedCost === "" ? null : Number(form.estimatedCost), shortfallKwh: ev && ev.kind === "production" ? ev.periodShortfall : null,
      shortfallValue: ev && ev.kind === "production" ? ev.periodValue : null, notes: form.note.trim() ? [{ date: todayISO(), text: form.note.trim() }] : [],
    });
  };
  return (
    <Overlay onClose={onClose}>
      <DialogHead title="Create investigation" sub="Prefilled from the detected anomaly. Edit anything before saving." onClose={onClose} />
      <form onSubmit={submit} className="fields">
        <div className="fields two">
          <label className="field">Site<select value={siteId} onChange={(e) => { setSiteId(e.target.value); setAnomalyId(""); }}>{siteList.map((s) => <option key={s.id} value={s.id}>{s.id} · {s.name}</option>)}</select></label>
          <label className="field">Linked anomaly<select value={anomalyId} onChange={(e) => setAnomalyId(e.target.value)}><option value="">None (manual task)</option>{options.map((e) => <option key={e.id} value={e.id}>{e.rule.replace(/_/g, " ")}, {C.fmtDate(e.start)}{e.ongoing ? ", ongoing" : ""}</option>)}</select></label>
        </div>
        {ev && ev.kind === "production" && <div className="callout warn"><strong>Impact in selected period: </strong>{num(ev.periodShortfall)} kWh shortfall, {C.money(ev.periodValue)} at ${R.settings.energyValue.toFixed(2)}/kWh (illustrative). EPI {pct(ev.periodEpi)} over {ev.periodDays} day{ev.periodDays === 1 ? "" : "s"}.</div>}
        {ev && ev.kind === "data" && <div className="callout info"><strong>Data gap: </strong>{ev.missingActual} missing reading{ev.missingActual === 1 ? "" : "s"} from {C.fmtDate(ev.start)}. No loss estimated.</div>}
        <label className="field">Title<input type="text" value={form.title} onChange={set("title")} required /></label>
        <label className="field">Description<textarea value={form.description} onChange={set("description")} style={{ fontFamily: "var(--f-body)", fontSize: "0.86rem" }} /></label>
        <div className="fields two">
          <label className="field">Priority<select value={form.priority} onChange={set("priority")}>{C.PRIORITIES.map((p) => <option key={p}>{p}</option>)}</select></label>
          <label className="field">Assign to<select value={form.assignee} onChange={set("assignee")}>{team.map((p) => <option key={p}>{p}</option>)}</select></label>
          <label className="field">Estimated cost (USD)<input type="number" min="0" step="1" value={form.estimatedCost} onChange={set("estimatedCost")} placeholder="optional" /></label>
          <label className="field">First note<input type="text" value={form.note} onChange={set("note")} placeholder="optional" /></label>
        </div>
        <div className="actions"><button type="button" className="btn" onClick={onClose}>Cancel</button><button type="submit" className="btn primary">Create {C.newTaskId(tasks)}</button></div>
      </form>
    </Overlay>
  );
}

// ---------------------------------------------------------------- Task drawer (edit, notes, resolve/reopen, delete)
function TaskDrawer({ task, R, onClose, onUpdate, onDelete, go }) {
  const [note, setNote] = useState("");
  const [confirmDel, setConfirmDel] = useState(false);
  const team = useContext(TeamCtx);
  const site = R.perSite[task.siteId] ? R.perSite[task.siteId].site : null;
  const ev = R.perSite[task.siteId] ? R.perSite[task.siteId].events.find((e) => e.id === task.anomalyId) : null;
  const set = (k) => (e) => onUpdate(task.id, { [k]: e.target.value });
  const addNote = () => { if (!note.trim()) return; onUpdate(task.id, { notes: [...task.notes, { date: todayISO(), text: note.trim() }] }); setNote(""); };
  return (
    <Overlay onClose={onClose} drawer>
      <DialogHead title={<span><span className="mono faint" style={{ fontWeight: 400, marginRight: 8 }}>{task.id}</span>{task.title}</span>} sub={`${site ? site.name : task.siteId} · created ${C.fmtDateLong(task.createdAt)}${task.resolvedAt ? " · resolved " + C.fmtDateLong(task.resolvedAt) : ""}`} onClose={onClose} />
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <Pill tone={TASK_TONE[task.status]}>{task.status}</Pill><Pill tone={PRIORITY_TONE[task.priority]}>{task.priority}</Pill>
        <button className="btn sm" onClick={() => { onClose(); go("site", task.siteId); }}>View site</button>
        {task.status === "Resolved"
          ? <button className="btn sm" onClick={() => onUpdate(task.id, { status: "Open", resolvedAt: null })}>Reopen</button>
          : <button className="btn sm primary" onClick={() => onUpdate(task.id, { status: "Resolved", resolvedAt: todayISO() })}>Mark resolved</button>}
      </div>
      {faultPersists(task, ev) && <div className="callout crit small"><strong>Fault still present.</strong> This task is Resolved, but production data still shows the anomaly. Reopen it to continue the investigation.</div>}
      {ev && ev.kind === "production" && <div className={"callout small " + (ev.recovered ? "good" : "warn")}><strong>Linked anomaly ({ev.lifecycle}): </strong>{ev.label}. {C.fmtDate(ev.start)} to {C.fmtDate(ev.end)}{ev.ongoing ? " (ongoing)" : ""}, EPI {pct(ev.epi)}, {num(ev.shortfallKwh)} kWh shortfall over the whole event. {ev.recovered ? `Recovery confirmed by production data on ${C.fmtDate(ev.recoveredOn)}.` : `Task status does not change the anomaly. It leaves the ranked queue only when ${C.RULES.RECOVERY_MIN_DAYS} valid days at or above ${C.RULES.UNDERPERF_EPI * 100}% of expected confirm recovery.`}</div>}
      {ev && ev.kind === "data" && <div className="callout info small"><strong>Linked data gap: </strong>{C.fmtDate(ev.start)} to {C.fmtDate(ev.end)}, {ev.missingActual} missing readings.</div>}
      <div className="fields">
        <label className="field">Title<input type="text" value={task.title} onChange={set("title")} /></label>
        <label className="field">Description<textarea value={task.description || ""} onChange={set("description")} style={{ fontFamily: "var(--f-body)", fontSize: "0.86rem" }} /></label>
        <div className="fields two">
          <label className="field">Status<select value={task.status} onChange={(e) => onUpdate(task.id, { status: e.target.value, resolvedAt: e.target.value === "Resolved" ? (task.resolvedAt || todayISO()) : null })}>{C.STATUSES.map((s) => <option key={s}>{s}</option>)}</select></label>
          <label className="field">Priority<select value={task.priority} onChange={set("priority")}>{C.PRIORITIES.map((p) => <option key={p}>{p}</option>)}</select></label>
          <label className="field">Assignee<select value={task.assignee} onChange={set("assignee")}>{(team.includes(task.assignee) ? team : [...team, task.assignee]).map((p) => <option key={p}>{p}</option>)}</select></label>
          <label className="field">Estimated cost (USD)<input type="number" min="0" step="1" value={task.estimatedCost == null ? "" : task.estimatedCost} onChange={(e) => onUpdate(task.id, { estimatedCost: e.target.value === "" ? null : Number(e.target.value) })} /></label>
        </div>
        {task.shortfallKwh != null && <dl className="kv"><dt>Shortfall at creation</dt><dd className="mono">{num(task.shortfallKwh)} kWh{task.shortfallValue != null ? ` (${C.money(task.shortfallValue)})` : ""}</dd>{task.estimatedCost != null && task.shortfallValue != null && <React.Fragment><dt>Cost vs exposure</dt><dd className="mono">{task.estimatedCost <= task.shortfallValue ? "cost below period exposure" : "cost exceeds period exposure"}</dd></React.Fragment>}</dl>}
      </div>
      <div>
        <h3 style={{ marginBottom: 8 }}>Notes <span className="faint small">({task.notes.length})</span></h3>
        <div className="notes">
          {task.notes.map((n, i) => <div className="note" key={i}><div className="d">{C.fmtDateLong(n.date)}</div>{n.text}</div>)}
          <div style={{ display: "flex", gap: 8 }}><input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Add a note" onKeyDown={(e) => { if (e.key === "Enter") addNote(); }} /><button className="btn" onClick={addNote} disabled={!note.trim()}>Add</button></div>
        </div>
      </div>
      <div className="actions" style={{ justifyContent: "space-between" }}>
        {confirmDel ? <span style={{ display: "flex", gap: 8, alignItems: "center" }} className="small"><span className="muted">Delete {task.id} permanently?</span><button className="btn sm danger" onClick={() => onDelete(task.id)}>Delete</button><button className="btn sm" onClick={() => setConfirmDel(false)}>Keep</button></span>
          : <button className="btn sm danger" onClick={() => setConfirmDel(true)}>Delete task</button>}
        <button className="btn" onClick={onClose}>Done</button>
      </div>
    </Overlay>
  );
}

// ---------------------------------------------------------------- CSV import dialog
function ImportDialog({ records, imports, siteIds, sample, cloud, onClose, onImport, onClearImports, toast }) {
  const [text, setText] = useState("");
  const [result, setResult] = useState(null);
  const [policy, setPolicy] = useState("overwrite");
  const [fileName, setFileName] = useState("");
  const ids = siteIds;
  const validate = (t) => { const r = C.validateImport(t, ids, records); setResult(r); return r; };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    setFileName(f.name);
    const reader = new FileReader();
    reader.onload = () => { const t = String(reader.result || ""); setText(t); validate(t); };
    reader.readAsText(f);
  };
  const confirm = () => {
    if (!result || !result.ok) return;
    const existing = new Set(records.map((r) => r.siteId + "|" + r.date));
    const recs = policy === "skip" ? result.records.filter((r) => !existing.has(r.siteId + "|" + r.date)) : result.records;
    onImport(recs, result.records.length - recs.length);
  };
  const preview = result ? result.records.slice(0, 15) : [];
  return (
    <Overlay onClose={onClose} wide>
      <DialogHead title="Import production data (CSV)" sub="Required columns: date, site_id, actual_kwh, expected_kwh. Optional: inverter_id, alarm_code, data_source. One row per site per day. Leave actual_kwh blank for a missing reading (it is never treated as zero)." onClose={onClose} />
      <div className="fields two">
        <label className="field">Upload file<input type="file" accept=".csv,text/csv,text/plain" onChange={onFile} />{fileName && <span className="small faint">{fileName}</span>}</label>
        <div className="field">Sample<div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}><button className="btn sm" onClick={() => { setText(sample); validate(sample); setFileName(""); }}>Load sample into editor</button><button className="btn sm" onClick={async () => toast((await copyText(sample)) ? "Sample CSV copied to clipboard" : "Copy blocked by browser; select the text in the editor instead")}>Copy sample CSV</button></div></div>
      </div>
      {cloud && <div className="callout info small">Rows are saved to your organization's database (source: csv_import). The server then re-runs the SolarOps analysis for the affected sites. CSV import is the backup path; connected monitoring is the primary one.</div>}
      <label className="field">Or paste CSV text<textarea value={text} onChange={(e) => { setText(e.target.value); setResult(null); }} placeholder={"date,site_id,actual_kwh,expected_kwh\n2026-11-10,MIA-01,1842.5,1910.2"} /></label>
      <div className="actions" style={{ justifyContent: "flex-start" }}><button className="btn" onClick={() => validate(text)} disabled={!text.trim()}>Validate</button>{imports.length > 0 && <button className="btn" onClick={onClearImports}>Remove {imports.length} previously imported row{imports.length === 1 ? "" : "s"}</button>}</div>
      {result && (
        <div className="stack" style={{ display: "grid", gap: 10 }}>
          {result.errors.length > 0 && <div className="callout crit"><strong>{result.errors.length} error{result.errors.length === 1 ? "" : "s"}. Nothing will be imported until these are fixed.</strong><ul style={{ margin: "6px 0 0", paddingLeft: 18 }}>{result.errors.slice(0, 12).map((e, i) => <li key={i}>{e}</li>)}{result.errors.length > 12 && <li>and {result.errors.length - 12} more</li>}</ul></div>}
          {result.warnings.length > 0 && <div className="callout warn"><strong>{result.warnings.length} warning{result.warnings.length === 1 ? "" : "s"}</strong><ul style={{ margin: "6px 0 0", paddingLeft: 18 }}>{result.warnings.slice(0, 8).map((e, i) => <li key={i}>{e}</li>)}</ul></div>}
          {result.ok && <div className="callout good"><strong>{result.records.length} valid row{result.records.length === 1 ? "" : "s"}.</strong> {result.overwrites > 0 ? `${result.overwrites} match existing site-days.` : "No conflicts with existing data."}</div>}
          {result.ok && result.overwrites > 0 && (
            <div className="fields" style={{ gap: 4 }}>
              <div className="eyebrow">Existing site-days</div>
              <label className="small"><input type="radio" name="pol" checked={policy === "overwrite"} onChange={() => setPolicy("overwrite")} /> Overwrite existing values with the file ({result.overwrites})</label>
              <label className="small"><input type="radio" name="pol" checked={policy === "skip"} onChange={() => setPolicy("skip")} /> Keep existing values, import only new site-days ({result.records.length - result.overwrites})</label>
            </div>
          )}
          {preview.length > 0 && (
            <div className="table-wrap" style={{ maxHeight: 240, overflowY: "auto" }}>
              <table><thead><tr><th>Date</th><th>Site</th><th className="r">Actual kWh</th><th className="r">Expected kWh</th><th>Quality</th><th>Source</th></tr></thead>

  const demo = useMemo(() => C.generateDemoRecords(), []);

  const [periodDays, setPeriodDays] = useState(() => { const p = load(KEYS.period, 30); return [7, 30, 90].includes(p) ? p : 30; });
  const [imports, setImports] = useState(() => load(KEYS.imports, []));
  const [tasks, setTasks] = useState(() => { const t = load(KEYS.tasks, null); return Array.isArray(t) ? t : C.seedTasks(demo); });
  const [persistOk, setPersistOk] = useState(true);
  useEffect(() => { setPersistOk(save(KEYS.tasks, tasks)); }, [tasks]);
  useEffect(() => { save(KEYS.settings, settings); }, [settings]);
  useEffect(() => { save(KEYS.imports, imports); }, [imports]);
  useEffect(() => { save(KEYS.period, periodDays); }, [periodDays]);
  const records = useMemo(() => C.mergeRecords(demo, imports), [demo, imports]);
  const endDate = useMemo(() => records.reduce((mx, r) => (r.date > mx ? r.date : mx), C.DEMO_END), [records]);
  return {

    sample: C.sampleCSV(),
    createTask: async (data) => {
      if (!C.canCreateTask(data.anomalyId, tasks)) return { existingId: C.taskForEvent(data.anomalyId, tasks).id };
      const id = C.newTaskId(tasks);
      setTasks((ts) => [...ts, Object.assign({ id, status: "Open", createdAt: todayISO(), resolvedAt: null, notes: [] }, data)]);
      return { id };
    },
    updateTask: (id, patch) => setTasks((ts) => ts.map((t) => (t.id === id ? Object.assign({}, t, patch) : t))),
    deleteTask: async (id) => setTasks((ts) => ts.filter((t) => t.id !== id)),
    importRecords: async (recs) => setImports((im) => C.mergeRecords(im, recs)),
    clearImports: () => setImports([]),
    updateSettings: async (patch) => setSettings((x) => Object.assign({}, x, patch)),
    reset: () => { setTasks(C.seedTasks(demo)); setImports([]); setSettings(Object.assign({}, C.DEFAULT_SETTINGS)); setPeriodDays(30); },
  };
}

// Cloud store: the organization's Supabase data is the source of truth; the engine runs on what was loaded.
const TEXT_FIELDS = ["title", "description", "estimatedCost"];
function useCloudStore(sb, identity, orgId, actions) {
  const [ws, setWs] = useState(null);
  const [tasks, setTasks] = useState([]);
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(0);
  const [periodDays, setPeriodDays] = useState(() => { const p = load(KEYS.period + "." + orgId, 30); return [7, 30, 90].includes(p) ? p : 30; });
  useEffect(() => { save(KEYS.period + "." + orgId, periodDays); }, [periodDays, orgId]);
  const pending = useRef({});      // taskId -> { patch, timer }
  const wsRef = useRef(null);
  const reload = useCallback(async () => {
    try { const w = await D.loadWorkspace(sb, orgId); wsRef.current = w; setWs(w); setTasks(w.tasks); setError(null); return w; }
    catch (e) { setError(e.message); return null; }
  }, [sb, orgId]);
  useEffect(() => { reload(); }, [reload]);
  const track = async (fn) => { setSaving((n) => n + 1); try { return await fn(); } finally { setSaving((n) => n - 1); } };
  const flush = (taskId) => {
    const p = pending.current[taskId]; if (!p) return;
    clearTimeout(p.timer); delete pending.current[taskId];
    const t = wsRef.current.tasks.find((x) => x.id === taskId) || tasks.find((x) => x.id === taskId);
    track(() => D.updateTask(sb, p.uuid, p.patch, wsRef.current.team)).then(() => reload()).catch((e) => { actions.toast("Could not save " + taskId + ": " + e.message); reload(); });
  };
  useEffect(() => () => Object.keys(pending.current).forEach(flush), []);
  if (!ws) return { mode: "cloud", ready: false, error, reload };
  const records = ws.records;
  const endDate = records.reduce((mx, r) => (r.date > mx ? r.date : mx), "") || C.addDays(todayISO(), -1);
  const siteCodes = ws.sites.map((s) => s.id);
  const sample = ["date,site_id,actual_kwh,expected_kwh,inverter_id,alarm_code,data_source"].concat(
    ws.sites.slice(0, 3).map((s, i) => `${C.addDays(endDate, 1)},${s.id},${(s.capacityKwp * 4.1).toFixed(1)},${(s.capacityKwp * 4.3).toFixed(1)},,,portal_export`)).join("\n");
  const role = (identity.memberships.find((m) => m.organization_id === orgId) || {}).role;
  return {
    mode: "cloud", ready: true, error, saving, reload, org: ws.org, role, userId: identity.user.id, email: identity.user.email,
    memberships: identity.memberships, members: ws.members, sites: ws.sites, records, tasks, settings: ws.settings, imports: [], team: ws.team,
    endDate, periodDays, setPeriodDays, persistOk: true, connections: ws.connections, connectionSites: ws.connectionSites, syncRuns: ws.syncRuns,
    sample: ws.sites.length ? sample : "date,site_id,actual_kwh,expected_kwh\n", siteCodes,
    createTask: (data) => track(async () => {
      const existing = C.taskForEvent(data.anomalyId, tasks);
      if (data.anomalyId && existing) return { existingId: existing.id };
      const row = await D.createTask(sb, wsRef.current, data);
      await reload();
      return { id: "INV-" + String(row.task_number).padStart(3, "0") };
    }),
    updateTask: (id, patch) => {
      const t = tasks.find((x) => x.id === id); if (!t) return;
      setTasks((ts) => ts.map((x) => (x.id === id ? Object.assign({}, x, patch) : x)));       // optimistic
      if (patch.notes && patch.notes.length > t.notes.length) {
        patch.notes.slice(t.notes.length).forEach((n) => track(() => D.addNote(sb, orgId, t.uuid, n.text)).catch((e) => actions.toast("Note not saved: " + e.message)));
      }
      const rest = Object.assign({}, patch); delete rest.notes; delete rest.resolvedAt;
      if (!Object.keys(rest).length) return;
      const p = pending.current[id] || { uuid: t.uuid, patch: {} };
      Object.assign(p.patch, rest); clearTimeout(p.timer); pending.current[id] = p;
      if (Object.keys(rest).every((k) => TEXT_FIELDS.includes(k))) p.timer = setTimeout(() => flush(id), 700);
      else flush(id);
    },
    deleteTask: (id) => track(async () => { const t = tasks.find((x) => x.id === id); await D.deleteTask(sb, t.uuid); await reload(); }),
    importRecords: (recs) => track(async () => { await D.importRecords(sb, wsRef.current, recs, "overwrite"); await reload(); }),
    clearImports: () => {},
    updateSettings: (patch) => track(async () => { await D.updateSettings(sb, orgId, patch); await reload(); }),
    saveSite: (form) => track(async () => {
      const row = await D.saveSite(sb, orgId, form);
      await D.analyze(sb, orgId, [row.id]);
      await reload();
    }),
    syncNow: (connectionId) => track(async () => { const r = await D.syncConnection(sb, connectionId); await reload(); return r; }),
    addMember: (email, role) => track(async () => { const r = await sb.rpc("add_member_by_email", { p_org: orgId, p_email: email, p_role: role }); if (r.error) throw new Error(r.error.message); await reload(); }),
    switchOrg: actions.switchOrg, newOrganization: actions.newOrganization, signOut: actions.signOut,
  };
}

// ---------------------------------------------------------------- Workspace (the v1 dashboard, store-agnostic)
function Workspace({ store, toast, toasts, header }) {
  const [route, setRoute] = useState(readHash);
  const [modal, setModal] = useState(null);
  useEffect(() => { const f = () => setRoute(readHash()); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  const { records, tasks, settings, periodDays, endDate } = store;
  const R = useMemo(() => C.compute({ records, tasks, settings, periodDays, endDate, sites: store.sites }), [records, tasks, settings, periodDays, endDate, store.sites]);
  const go = (view, siteId) => { const h = view === "site" ? "site-" + siteId : view; if (location.hash !== "#" + h) location.hash = h; else setRoute(readHash()); document.querySelector(".content") && (document.querySelector(".content").scrollTop = 0); };
  const openCreate = (siteId, anomalyId) => setModal({ type: "create", siteId, anomalyId });
  const openTask = (id) => setModal({ type: "task", id });
  const close = useCallback(() => setModal(null), []);
  const createTask = async (data) => {
    try {
      const r = await store.createTask(data);
      if (r.existingId) { toast(`${r.existingId} already covers this anomaly. Opened it instead of creating a duplicate.`); setModal({ type: "task", id: r.existingId }); return; }
      toast(`${r.id} created${data.anomalyId ? " and linked to the anomaly" : ""}.`);
      setModal({ type: "task", id: r.id });
    } catch (e) { toast("Could not create the investigation: " + e.message); }
  };
  const reopenTask = (id) => { store.updateTask(id, { status: "Open", resolvedAt: null }); setModal({ type: "task", id }); toast(`${id} reopened.`); };
  const deleteTask = async (id) => { try { await store.deleteTask(id); setModal(null); toast(`${id} deleted.`); } catch (e) { toast("Could not delete: " + e.message); } };
  const doImport = async (recs, skipped) => {
    try { await store.importRecords(recs); setModal(null); toast(`Imported ${recs.length} row${recs.length === 1 ? "" : "s"}${skipped ? `, skipped ${skipped} existing` : ""}. ${store.mode === "cloud" ? "Saved and re-analyzed on the server." : "Metrics recalculated."}`); }
    catch (e) { toast("Import failed: " + e.message); }
  };
  const title = route.view === "site" ? (R.perSite[route.siteId] ? R.perSite[route.siteId].site.name : "Site") : route.view === "maintenance" ? "Maintenance Operations" : "Portfolio Command Center";
  const sitesOrdered = Object.values(R.perSite).sort((a, b) => (a.rank || 99) - (b.rank || 99) || a.site.id.localeCompare(b.site.id));
  const currentTask = modal && modal.type === "task" ? tasks.find((t) => t.id === modal.id) : null;
  const cloud = store.mode === "cloud";
  const badge = !cloud ? { text: "Demo mode: synthetic data", tip: "All sites, production figures and the baseline are synthetic. Imported CSV rows are the only non-synthetic data." }
    : store.org.is_demo ? { text: "Demo organization: synthetic data (mock connector)", tip: "This organization is flagged as a demo. The database only accepts synthetic or mock data here and never mixes it with customer organizations." }
    : null;
  const noSites = store.sites.length === 0;
  return (
    <TeamCtx.Provider value={store.team}>
      <div className="app">
        <aside className="rail">
          <div className="brand"><div className="mark"><span style={{ color: "#fff", display: "flex" }}><Icon name="sun" /></span></div><div className="word">Solar<span>Ops</span></div></div>
          <nav className="nav" aria-label="Main">
            <button aria-current={route.view === "portfolio" ? "page" : undefined} onClick={() => go("portfolio")}><Icon name="grid" />Portfolio{R.ranked.length > 0 && <span className="count">{R.ranked.length}</span>}</button>
            <button aria-current={route.view === "maintenance" ? "page" : undefined} onClick={() => go("maintenance")}><Icon name="wrench" />Maintenance{R.openTasks > 0 && <span className="count">{R.openTasks}</span>}</button>
            <div className="eyebrow nav-sites-label" style={{ padding: "10px 10px 4px" }}>Sites</div>
            <div className="nav-sites">
              {sitesOrdered.map((p) => <button key={p.site.id} aria-current={route.view === "site" && route.siteId === p.site.id ? "page" : undefined} onClick={() => go("site", p.site.id)}><span className={"dot " + STATUS_TONE[p.status.status]} />{p.site.name}{p.rank && <span className="count">#{p.rank}</span>}</button>)}
            </div>
          </nav>
          <div className="spacer" />
          {cloud && <div className="org-chip" title={`Signed in as ${store.email}`}><div className="eyebrow">Organization</div><div className="cell-title">{store.org.name}</div><div className="small faint">{store.role} · {store.email}</div></div>}
          {badge && <div className="demo-badge" title={badge.tip}>{badge.text}</div>}
          {header}
        </aside>
        <main className="main">
          <header className="topbar">
            <div className="crumbs"><h1 style={{ fontSize: "1.05rem" }}>{title}</h1>{route.view === "site" && <span className="faint small">Site intelligence</span>}</div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              {cloud && <span className="small faint" aria-live="polite">{store.saving > 0 ? "Saving…" : "All changes saved"}</span>}
              <span className="small faint">Window ending {C.fmtDate(endDate)}</span>
              <div className="seg" role="group" aria-label="Period">{[7, 30, 90].map((n) => <button key={n} aria-pressed={periodDays === n} onClick={() => store.setPeriodDays(n)}>{n}d</button>)}</div>
              <button className="btn" onClick={() => setModal({ type: "import" })} disabled={noSites}>Import CSV</button>
              <button className="btn" onClick={() => setModal({ type: "settings" })}>Settings</button>
            </div>
          </header>
          <div className="content">
            {!store.persistOk && <div className="callout warn small">This browser is blocking local storage. Changes will work but will not survive a refresh.</div>}
            {store.error && <div className="callout crit small">Could not load from the server: {store.error} <button className="btn sm" onClick={store.reload}>Retry</button></div>}
            {noSites && <div className="callout info">No sites in {cloud ? store.org.name : "this workspace"} yet. Add your first site under <strong>Settings › Sites</strong>, then import a CSV or connect a monitoring source.</div>}
            {route.view === "portfolio" && <Portfolio R={R} records={records} tasks={tasks} go={go} openCreate={openCreate} />}
            {route.view === "site" && <SiteView R={R} siteId={route.siteId} tasks={tasks} go={go} openCreate={openCreate} openTask={openTask} reopenTask={reopenTask} />}
            {route.view === "maintenance" && <Maintenance R={R} tasks={tasks} go={go} openCreate={openCreate} openTask={openTask} updateTask={store.updateTask} reopenTask={reopenTask} />}
            <p className="small faint" style={{ marginTop: 28, maxWidth: "72ch" }}>SolarOps v2. Every figure on screen is computed from daily actual and expected kWh with deterministic rules; nothing is predicted or learned. Anomalies flag performance deviations and do not confirm a physical equipment fault. Dollar values are estimates at the rate in Settings, not verified lost or recoverable revenue. {cloud ? (store.org.is_demo ? "This demo organization contains synthetic data only." : "Data shown is your organization's stored data.") : "Demo sites and data are synthetic and do not represent real facilities."}</p>
          </div>
        </main>
        {modal && modal.type === "create" && <CreateDialog R={R} tasks={tasks} siteId={modal.siteId} anomalyId={modal.anomalyId} onClose={close} onCreate={createTask} />}
        {currentTask && <TaskDrawer task={currentTask} R={R} onClose={close} onUpdate={store.updateTask} onDelete={deleteTask} go={go} />}
        {modal && modal.type === "import" && <ImportDialog records={records} imports={store.imports} siteIds={store.sites.map((s) => s.id)} sample={store.sample} cloud={cloud} onClose={close} onImport={doImport} onClearImports={() => { store.clearImports(); setModal(null); toast("Imported rows removed. Demo data restored."); }} toast={toast} />}
        {modal && modal.type === "settings" && <SettingsDialog store={store} onClose={close} toast={toast} />}
        <Toasts items={toasts} />
      </div>
    </TeamCtx.Provider>
  );
}

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((text) => { const id = Date.now() + Math.random(); setToasts((t) => [...t, { id, text }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200); }, []);
  return [toasts, toast];
}

function DemoApp({ onSignIn }) {
  const [toasts, toast] = useToasts();
  const store = useDemoStore();
  return <Workspace store={store} toast={toast} toasts={toasts} header={onSignIn ? <button className="btn sm" onClick={onSignIn}>Sign in to SolarOps</button> : null} />;
}

// ---------------------------------------------------------------- Cloud: auth, onboarding, workspace
function CenterCard({ children, wide }) {
  return <div className="auth-wrap"><div className="card auth-card" style={wide ? { maxWidth: 640 } : null}><div className="brand" style={{ marginBottom: 14 }}><div className="mark"><span style={{ color: "#fff", display: "flex" }}><Icon name="sun" /></span></div><div className="word">Solar<span>Ops</span></div></div>{children}</div></div>;
}

function AuthScreen({ sb, onDemo }) {
  const [tab, setTab] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [fullName, setFullName] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setBusy(true); setMsg(null);
    try {
      if (tab === "signin") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const redirect = /^https?:/.test(location.href) ? location.origin + location.pathname : undefined;
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName }, emailRedirectTo: redirect } });
        if (error) throw error;
        if (!data.session) setMsg({ tone: "good", text: "Account created. Check your inbox and confirm your email, then sign in here." });
      }
    } catch (err) { setMsg({ tone: "crit", text: err.message }); }
    finally { setBusy(false); }
  };
  return (
    <CenterCard>
      <div className="tabs" role="tablist" style={{ marginBottom: 14 }}>
        <button role="tab" aria-selected={tab === "signin"} onClick={() => setTab("signin")}>Sign in</button>
        <button role="tab" aria-selected={tab === "signup"} onClick={() => setTab("signup")}>Create account</button>
      </div>
      <form onSubmit={submit} className="fields">
        {tab === "signup" && <label className="field">Full name<input type="text" value={fullName} onChange={(e) => setFullName(e.target.value)} autoComplete="name" /></label>}
        <label className="field">Email<input type="text" inputMode="email" value={email} onChange={(e) => setEmail(e.target.value)} required autoComplete="email" /></label>
        <label className="field">Password<input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength={8} autoComplete={tab === "signin" ? "current-password" : "new-password"} /></label>
        {msg && <div className={"callout small " + msg.tone}>{msg.text}</div>}
        <button className="btn primary" type="submit" disabled={busy} style={{ justifyContent: "center" }}>{busy ? "Please wait…" : tab === "signin" ? "Sign in" : "Create account"}</button>
      </form>
      <hr style={{ border: 0, borderTop: "1px solid var(--line)", margin: "16px 0" }} />
      <button className="btn" style={{ width: "100%", justifyContent: "center" }} onClick={onDemo}>Open the offline demo (synthetic data, no account)</button>
      <p className="small faint" style={{ marginTop: 10 }}>Signed-in data is stored in SolarOps' Supabase database and isolated per organization by row-level security.</p>
    </CenterCard>
  );
}

function Onboarding({ sb, identity, onDone, onCancel }) {
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(null);
  const [err, setErr] = useState(null);
  const createReal = async (e) => {
    e.preventDefault(); setBusy("real"); setErr(null);
    try { const id = await D.createOrganization(sb, name, false); await D.switchOrganization(sb, identity.user.id, id); onDone(id); }
    catch (x) { setErr(x.message); setBusy(null); }
  };
  const createDemo = async () => {
    setBusy("demo"); setErr(null);
    try {
      const id = await D.createOrganization(sb, "SolarOps Demo (synthetic)", true);
      await D.switchOrganization(sb, identity.user.id, id);
      await D.seedDemoOrganization(sb, id, C);
      onDone(id);
    } catch (x) { setErr(x.message); setBusy(null); }
  };
  return (
    <CenterCard wide>
      <h2 style={{ marginBottom: 6 }}>Set up your organization</h2>
      <p className="small muted" style={{ marginBottom: 14 }}>Everything in SolarOps belongs to an organization. You will be its owner.</p>
      <form onSubmit={createReal} className="fields">
        <label className="field">Organization name<input type="text" value={name} onChange={(e) => setName(e.target.value)} required placeholder="e.g. Sunshine Solar O&M" /></label>
        <button className="btn primary" type="submit" disabled={!!busy} style={{ justifyContent: "center" }}>{busy === "real" ? "Creating…" : "Create organization"}</button>
      </form>
      <hr style={{ border: 0, borderTop: "1px solid var(--line)", margin: "16px 0" }} />
      <div className="fields">
        <div className="small muted"><strong>Or try the automatic-ingestion demo.</strong> Creates a separate demo organization with the six synthetic Florida sites, connects them to the <strong>mock monitoring connector</strong>, and runs a first 90-day sync through the real backend pipeline (validation, idempotent upsert, server-side analysis). It is labeled as synthetic everywhere and can never mix with real data.</div>
        <button className="btn" onClick={createDemo} disabled={!!busy} style={{ justifyContent: "center" }}>{busy === "demo" ? "Creating demo and syncing 90 days…" : "Create demo organization"}</button>
      </div>
      {err && <div className="callout crit small" style={{ marginTop: 12 }}>{err}</div>}
      <div className="actions" style={{ marginTop: 12 }}>{onCancel && <button className="btn" onClick={onCancel}>Back</button>}<button className="btn" onClick={() => sb.auth.signOut()}>Sign out</button></div>
    </CenterCard>
  );
}

function CloudApp({ sb, session }) {
  const [identity, setIdentity] = useState(null);
  const [orgId, setOrgId] = useState(null);
  const [onboarding, setOnboarding] = useState(false);
  const [err, setErr] = useState(null);
  const [toasts, toast] = useToasts();
  const refreshIdentity = useCallback(async (preferOrg) => {
    try {
      const id = await D.loadIdentity(sb);
      setIdentity(id);
      const ids = id.memberships.map((m) => m.organization_id);
      const pick = [preferOrg, id.profile && id.profile.organization_id, ids[0]].find((x) => x && ids.includes(x)) || null;
      setOrgId(pick);
      setOnboarding(!pick);
    } catch (e) { setErr(e.message); }
  }, [sb]);
  useEffect(() => { refreshIdentity(); }, [refreshIdentity, session.user.id]);
  if (err) return <CenterCard><div className="callout crit">{err}</div><div className="actions" style={{ marginTop: 12 }}><button className="btn" onClick={() => location.reload()}>Retry</button><button className="btn" onClick={() => sb.auth.signOut()}>Sign out</button></div></CenterCard>;
  if (!identity) return <CenterCard><p className="muted">Loading your organizations…</p></CenterCard>;
  if (onboarding || !orgId) return <Onboarding sb={sb} identity={identity} onDone={(id) => refreshIdentity(id)} onCancel={orgId ? () => setOnboarding(false) : null} />;
  const actions = {
    toast,
    switchOrg: async (id) => { await D.switchOrganization(sb, identity.user.id, id); location.hash = ""; refreshIdentity(id); },
    newOrganization: () => setOnboarding(true),
    signOut: () => sb.auth.signOut(),
  };
  return <CloudWorkspace key={orgId} sb={sb} identity={identity} orgId={orgId} actions={actions} toast={toast} toasts={toasts} />;
}

function CloudWorkspace({ sb, identity, orgId, actions, toast, toasts }) {
  const store = useCloudStore(sb, identity, orgId, actions);
  if (!store.ready) return <CenterCard>{store.error ? <><div className="callout crit">Could not load the organization: {store.error}</div><div className="actions" style={{ marginTop: 12 }}><button className="btn" onClick={store.reload}>Retry</button><button className="btn" onClick={actions.signOut}>Sign out</button></div></> : <p className="muted">Loading sites, production history and investigations…</p>}</CenterCard>;
  return <Workspace store={store} toast={toast} toasts={toasts} />;
}

// ---------------------------------------------------------------- Root
const CONFIG = window.SOLAROPS_CONFIG || null;   // { url, publishableKey }: public values only, never a secret key
function Root() {
  const sb = useMemo(() => (CONFIG && window.supabase ? window.supabase.createClient(CONFIG.url, CONFIG.publishableKey) : null), []);
  const [mode, setMode] = useState(() => load("solarops.mode", sb ? "cloud" : "demo"));
  const [session, setSession] = useState(undefined);
  useEffect(() => { save("solarops.mode", mode); }, [mode]);
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, [sb]);
  if (!sb || mode === "demo") return <DemoApp onSignIn={sb ? () => setMode("cloud") : null} />;
  if (session === undefined) return <CenterCard><p className="muted">Connecting…</p></CenterCard>;
  if (!session) return <AuthScreen sb={sb} onDemo={() => setMode("demo")} />;
  return <CloudApp sb={sb} session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>

</body>
</html>
