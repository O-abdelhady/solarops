<!doctype html>
<html lang="en">

<style>
/* Layout: fixed left rail (nav + tools) and a scrolling work area. Light-only by design: a daytime operations console. */
:root {
  color-scheme: light;
  --bg: #f3f5f4;          /* cool neutral with a touch of green */
  --surface: #ffffff;
  --surface-2: #f8faf9;
  --ink: #1b2420;
  --ink-2: #4b5651;
  --ink-3: #74807a;
  --line: #e1e6e3;
  --line-2: #ccd4d0;
  --accent: #1f5f3f;      /* deep forest green */
  --accent-ink: #ffffff;
  --accent-soft: #e4efe8;
  --good: #1e8a4c; --good-soft: #e3f3e9;
  --warn: #b7791f; --warn-soft: #fbf1dc;
  --crit: #c23b3b; --crit-soft: #fbe6e6;
  --info: #3b6ea8; --info-soft: #e5eef8;
  --actual: #1f5f3f;
  --expected: #8a949e;
  --band-under: rgba(183,121,31,0.14);
  --band-out: rgba(194,59,59,0.14);
  --band-data: rgba(59,110,168,0.12);
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  --shadow: 0 1px 2px rgba(27,36,32,0.05), 0 6px 20px rgba(27,36,32,0.06);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 1.35rem; } h2 { font-size: 1.05rem; } h3 { font-size: 0.95rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.small { font-size: 0.8rem; }
.eyebrow { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
a { color: var(--accent); }

/* ---------- app frame ---------- */
#root { height: 100%; }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px;
  padding-block: 18px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand .word { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
.brand .word span { color: var(--accent); }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 0.72rem; font-family: var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.nav button[aria-current="page"] .count { background: var(--surface); }
.nav-sites { display: grid; gap: 1px; padding-left: 6px; }
.nav-sites button { padding: 5px 10px; font-size: 0.82rem; font-weight: 400; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line-2); }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.info { background: var(--info); } .dot.neutral { background: var(--ink-3); }
.rail .spacer { flex: 1; }
.demo-badge { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 8px; text-align: center; }

.main { min-width: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; }
.topbar .crumbs .sep { color: var(--line-2); }
.content { flex: 1; overflow-y: auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.content > * + * { margin-top: 18px; }
.stack > * + * { margin-top: 18px; }

/* ---------- controls ---------- */
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 0.82rem; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; font-size: 0.85rem; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: var(--surface); }
.btn.sm { padding: 4px 9px; font-size: 0.78rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .nav button:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="number"], input[type="search"], select, textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); }
textarea { min-height: 90px; resize: vertical; font-family: var(--f-mono); font-size: 0.8rem; }
label.field { display: grid; gap: 4px; font-size: 0.8rem; font-weight: 500; color: var(--ink-2); }
.fields { display: grid; gap: 12px; }
.fields.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* ---------- cards & KPIs ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin-bottom: 12px; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--f-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .v.crit { color: var(--crit); } .kpi .v.warn { color: var(--warn); }
.kpi .s { font-size: 0.74rem; color: var(--ink-3); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

/* ---------- pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.rank { background: var(--ink); color: #fff; font-family: var(--f-mono); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { text-align: left; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--ink); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.row-link { cursor: pointer; } tbody tr.row-link:hover td { background: var(--surface-2); }
.cell-title { font-weight: 500; } .cell-sub { font-size: 0.76rem; color: var(--ink-3); }

/* ---------- attention list ---------- */
.attn { display: grid; gap: 8px; }
.attn-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.attn-item .title { font-weight: 500; }
.attn-item .meta { font-size: 0.78rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.attn-item .money { font-family: var(--f-mono); font-weight: 500; text-align: right; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 10px; font-size: 0.76rem; line-height: 1.4; white-space: nowrap; box-shadow: var(--shadow); z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; border-top: 2px solid; display: inline-block; } .sw.dash { border-top-style: dashed; }
.sw.box { width: 12px; height: 12px; border: 0; border-radius: 2px; }

/* ---------- insight ---------- */
.insight { border-left: 4px solid var(--accent); }
.insight.warn { border-left-color: var(--warn); } .insight.crit { border-left-color: var(--crit); } .insight.info { border-left-color: var(--info); } .insight.good { border-left-color: var(--good); }
.insight-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.insight-row:first-of-type { border-top: 0; }
.insight-row .k { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
.insight-row ul { margin: 0; padding-left: 18px; } .insight-row li + li { margin-top: 2px; }
.insight-row .v { max-width: 72ch; }

/* ---------- tabs ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 12px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-3); margin-left: 4px; }

/* ---------- dialogs / drawer ---------- */
.overlay { position: fixed; inset: 0; background: rgba(27,36,32,0.38); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 20px; display: grid; gap: 14px; }
.dialog.wide { width: min(860px, 100%); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); box-shadow: var(--shadow); z-index: 50; overflow-y: auto; padding: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; border-left: 1px solid var(--line); }
.dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.x { border: 0; background: transparent; font-size: 1.2rem; line-height: 1; color: var(--ink-3); padding: 2px 6px; border-radius: 6px; } .x:hover { background: var(--surface-2); color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.notes { display: grid; gap: 8px; }
.note { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 0.84rem; }
.note .d { font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-3); }
.callout { padding: 10px 12px; border-radius: 8px; font-size: 0.84rem; }
.callout.warn { background: var(--warn-soft); color: #6b4a0e; } .callout.crit { background: var(--crit-soft); color: #7a2323; } .callout.info { background: var(--info-soft); color: #234a78; } .callout.good { background: var(--good-soft); color: #175c34; }
.pre { font-family: var(--f-mono); font-size: 0.76rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre; }
.toasts { position: fixed; bottom: 16px; right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 0.84rem; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; }
.toast button { background: transparent; border: 0; color: #9fd8b8; font-weight: 600; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.84rem; } .kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
.site-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--ink-2); }

/* ---------- auth / org ---------- */
.auth-wrap { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth-card { width: min(420px, 100%); padding: 24px; box-shadow: var(--shadow); }
.org-chip { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); display: grid; gap: 1px; min-width: 0; }
.org-chip .cell-title, .org-chip .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 8px 12px; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; } .nav button { width: auto; } .nav-sites, .nav-sites-label { display: none; } .rail .spacer { display: none; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .insight-row { grid-template-columns: minmax(0, 1fr); }
  .fields.two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: minmax(0, 1fr); } .attn-item { grid-template-columns: minmax(0, 1fr); } .attn-item .money { text-align: left; } }
@media (prefers-reduced-motion: no-preference) { .btn, .nav button, .seg button { transition: background .12s, color .12s; } }
</style>

<script>
/* SolarOps v1 core: data models, deterministic demo seed, analytics engine,
   anomaly rules, ranking, insight templates, CSV validation.
   Pure JS, no DOM. Runs in the browser (window.SolarOpsCore) and in Node (module.exports). */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.SolarOpsCore = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // ---------------------------------------------------------------- constants
  const DEMO_END = "2026-11-09";      // last day of the synthetic dataset ("today" in demo mode)
  const DEMO_DAYS = 90;
  const DEFAULT_SETTINGS = { energyValue: 0.12, currency: "USD" };
  const RULES = {
    UNDERPERF_EPI: 0.85,        // Rule 1: EPI below 85%
    UNDERPERF_MIN_DAYS: 3,      // for 3 consecutive eligible days
    UNDERPERF_MIN_YIELD: 0.5,   // day eligible only if expected > 0.5 kWh per kWp
    OUTAGE_MAX_RATIO: 0.05,     // Rule 2: actual at most 5% of expected
    OUTAGE_MIN_YIELD: 1.0,      // and expected at least 1 kWh per kWp
    INSUFFICIENT_COVERAGE: 60,  // Rule 5: below 60% coverage, no reliable assessment
    RECOVERY_MIN_DAYS: 2,       // recovery = 2 valid days after the event at or above the Rule 1 EPI threshold
  };
  const STATUSES = ["Open", "Investigating", "Scheduled", "Resolved"];
  const PRIORITIES = ["Critical", "High", "Medium", "Low"];
  const TEAM = ["Unassigned", "Maria Lopez (O&M lead)", "Devin Carter (field tech)", "Priya Nair (asset manager)", "External contractor"];

  // ---------------------------------------------------------------- dates
  const pad = (n) => String(n).padStart(2, "0");
  function toISO(d) { return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function addDays(iso, n) { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return toISO(d); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  function periodDates(endISO, n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(addDays(endISO, -i)); return out; }
  function fmtDate(iso) {
    const M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const d = parseISO(iso); return `${M[d.getUTCMonth()]} ${d.getUTCDate()}`;
  }
  function fmtDateLong(iso) { return fmtDate(iso) + ", " + iso.slice(0, 4); }

  // ---------------------------------------------------------------- deterministic PRNG
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(rand) { // Box-Muller
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---------------------------------------------------------------- demo portfolio
  const SITES = [
    { id: "MIA-01", name: "Biscayne Freight Terminal", type: "Commercial Warehouse", city: "Miami", state: "FL", capacityKwp: 480, inverter: "SolarEdge (string, DC-optimized)", commissioned: "2023-03-14", siteFactor: 1.00, scenario: "healthy" },
    { id: "ORL-02", name: "Lake Nona Crossing", type: "Retail Plaza", city: "Orlando", state: "FL", capacityKwp: 240, inverter: "SMA Sunny Tripower (string)", commissioned: "2022-09-02", siteFactor: 0.97, scenario: "sustained_underperformance" },
    { id: "TPA-03", name: "Gulfport Distribution Center", type: "Distribution Center", city: "Tampa", state: "FL", capacityKwp: 720, inverter: "Sungrow (string)", commissioned: "2024-01-20", siteFactor: 1.02, scenario: "possible_outage" },
    { id: "JAX-04", name: "Deerwood Business Park", type: "Business Park", city: "Jacksonville", state: "FL", capacityKwp: 310, inverter: "Fronius Symo (string)", commissioned: "2021-11-08", siteFactor: 0.95, scenario: "missing_data" },
    { id: "FLL-05", name: "Cypress Creek Office Complex", type: "Office Complex", city: "Fort Lauderdale", state: "FL", capacityKwp: 150, inverter: "SolarEdge (string, DC-optimized)", commissioned: "2023-07-30", siteFactor: 1.01, scenario: "recovered_event" },
    { id: "WPB-06", name: "Okeeheelee Community Center", type: "Community Facility", city: "West Palm Beach", state: "FL", capacityKwp: 90, inverter: "Enphase IQ8 (microinverters)", commissioned: "2024-05-11", siteFactor: 1.04, scenario: "normal_variability" },
  ];

  function generateDemoRecords(seed) {
    const rand = mulberry32(seed || 20261109);
    const dates = periodDates(DEMO_END, DEMO_DAYS);
    // Regional daily "weather" yield in kWh per kWp: seasonal drift from ~4.9 (Aug) to ~3.9 (Nov) plus day-to-day variation
    const regional = dates.map((d, i) => {
      const season = 4.9 - 1.0 * (i / (DEMO_DAYS - 1));
      let y = season * (1 + 0.12 * gauss(rand));
      if (rand() < 0.12) y *= 0.55;          // overcast / rainy day
      return Math.min(5.5, Math.max(2.0, y));
    });
    const records = [];
    SITES.forEach((s) => {
      dates.forEach((date, i) => {
        const localWeather = 1 + 0.05 * gauss(rand);
        let expected = s.capacityKwp * regional[i] * s.siteFactor * localWeather;
        expected = Math.round(expected * 10) / 10;
        let perf = 1 + 0.03 * gauss(rand);
        let actual = null, quality = "valid";
        switch (s.scenario) {
          case "healthy": break;
          case "sustained_underperformance":
            if (i >= 78) perf = 0.75 + 0.04 * gauss(rand);       // last 12 days, ongoing
            break;
          case "possible_outage":
            if (i >= 86) perf = 0.012 + 0.01 * rand();           // last 4 days near zero, ongoing
            break;
          case "missing_data":
            if (i >= 83 && i <= 86) { quality = "missing_actual"; }
            if (i === 41) { quality = "missing_actual"; }       // one isolated historical gap
            break;
          case "recovered_event":
            if (i >= 30 && i <= 38) perf = 0.72 + 0.04 * gauss(rand);  // historical, then normal
            break;
          case "normal_variability":
            perf = 1 + 0.06 * gauss(rand);
            if (rand() < 0.08) perf = 1.07 + 0.03 * rand();      // above-baseline days
            if (i === 50) { expected = null; quality = "missing_baseline"; }
            break;
        }
        if (quality === "valid") actual = Math.round(Math.max(0, expected * perf) * 10) / 10;
        if (quality === "missing_baseline") actual = Math.round(s.capacityKwp * regional[i] * s.siteFactor * 10) / 10;
        records.push({
          siteId: s.id, date, capacityKwp: s.capacityKwp,
          expectedKwh: expected, actualKwh: actual,
          dataSource: "demo_monitoring", baselineSource: "demo_baseline", quality,
        });
      });
    });
    return records;
  }

  // ---------------------------------------------------------------- record helpers
  function isValidPair(r) {
    return r && r.actualKwh != null && r.expectedKwh != null && Number.isFinite(r.actualKwh) && Number.isFinite(r.expectedKwh) && r.expectedKwh > 0;
  }
  function recordMap(records) {
    const m = new Map();
    records.forEach((r) => m.set(r.siteId + "|" + r.date, r));
    return m;
  }
  /** Merge imported records over demo records. Imported records win by (siteId, date). */
  function mergeRecords(demo, imported) {
    const m = recordMap(demo);
    (imported || []).forEach((r) => m.set(r.siteId + "|" + r.date, r));
    return Array.from(m.values());
  }

  // ---------------------------------------------------------------- analytics
  /** Metrics for one site over a list of dates (eligible days = dates on/after commissioning). */
  function priceFor(site, settings) {
    return site && site.energyValue != null ? Number(site.energyValue) : (settings || DEFAULT_SETTINGS).energyValue;
  }
  function siteMetrics(records, site, dates, settings) {
    const price = priceFor(site, settings);
    const byDate = new Map(records.filter((r) => r.siteId === site.id).map((r) => [r.date, r]));
    const eligible = dates.filter((d) => d >= site.commissioned);
    let actual = 0, expected = 0, shortfall = 0, valid = 0, missingActual = 0, missingBaseline = 0, invalid = 0, noRecord = 0;
    const days = eligible.map((d) => {
      const r = byDate.get(d);
      if (!r) { noRecord++; return { date: d, status: "no_record", actual: null, expected: null }; }
      if (isValidPair(r)) {
        valid++; actual += r.actualKwh; expected += r.expectedKwh; shortfall += Math.max(0, r.expectedKwh - r.actualKwh);
        return { date: d, status: "valid", actual: r.actualKwh, expected: r.expectedKwh, epi: r.actualKwh / r.expectedKwh };
      }
      if (r.actualKwh == null && r.expectedKwh != null) { missingActual++; return { date: d, status: "missing_actual", actual: null, expected: r.expectedKwh }; }
      if (r.expectedKwh == null) { missingBaseline++; return { date: d, status: "missing_baseline", actual: r.actualKwh, expected: null }; }
      invalid++; return { date: d, status: "invalid", actual: r.actualKwh, expected: r.expectedKwh };
    });
    const epi = expected > 0 ? (actual / expected) * 100 : null;
    const coverage = eligible.length ? (valid / eligible.length) * 100 : null;
    return {
      siteId: site.id, days, eligibleDays: eligible.length, validDays: valid,
      missingActual, missingBaseline, invalid, noRecord,
      actualKwh: round(actual, 1), expectedKwh: round(expected, 1), epi: epi == null ? null : round(epi, 1),
      shortfallKwh: round(shortfall, 1), shortfallValue: round(shortfall * price, 2), energyValue: price,
      coverage: coverage == null ? null : round(coverage, 1),
      lastMeasurement: lastValidDate(records, site.id),
    };
  }
  function lastValidDate(records, siteId) {
    let last = null;
    records.forEach((r) => { if (r.siteId === siteId && r.actualKwh != null && (!last || r.date > last)) last = r.date; });
    return last;
  }
  /** Weighted portfolio EPI: sum of actual over sum of expected across valid pairs. Never an average of percentages. */
  function portfolioMetrics(perSite, settings) {
    const price = (settings || DEFAULT_SETTINGS).energyValue;
    let a = 0, e = 0, sf = 0, val = 0;
    perSite.forEach((m) => { a += m.actualKwh; e += m.expectedKwh; sf += m.shortfallKwh; val += m.shortfallKwh * (m.energyValue != null ? m.energyValue : price); });
    return {
      actualKwh: round(a, 1), expectedKwh: round(e, 1), epi: e > 0 ? round((a / e) * 100, 1) : null,
      shortfallKwh: round(sf, 1), shortfallValue: round(val, 2),
    };
  }
  function round(x, d) { const p = Math.pow(10, d); return Math.round(x * p) / p; }

  // ---------------------------------------------------------------- anomaly detection (deterministic rules)
  /** Classify every record day for a site, then group consecutive days into events. */
  function detectAnomalies(records, site) {
    const rs = records.filter((r) => r.siteId === site.id && r.date >= site.commissioned).sort((x, y) => x.date < y.date ? -1 : 1);
    const cap = site.capacityKwp;
    const dayClass = rs.map((r) => {
      if (r.actualKwh == null || r.expectedKwh == null) return { r, cls: "missing" };
      if (!(r.expectedKwh > 0)) return { r, cls: "none" };
      const yieldPerKwp = r.expectedKwh / cap;
      const ratio = r.actualKwh / r.expectedKwh;
      if (ratio <= RULES.OUTAGE_MAX_RATIO && yieldPerKwp >= RULES.OUTAGE_MIN_YIELD) return { r, cls: "outage", ratio };
      if (ratio < RULES.UNDERPERF_EPI && yieldPerKwp > RULES.UNDERPERF_MIN_YIELD) return { r, cls: "under", ratio };
      return { r, cls: "none", ratio };
    });
    const events = [];
    let run = [];
    const flush = () => {
      if (!run.length) return;
      const cls = run[0].cls;
      if (cls === "under" && run.length < RULES.UNDERPERF_MIN_DAYS) { run = []; return; }
      const start = run[0].r.date, end = run[run.length - 1].r.date;
      const ev = {
        id: `${site.id}:${cls}:${start}`, siteId: site.id, start, end, days: run.length,
        ongoing: end === rs[rs.length - 1].date,
        dates: run.map((x) => x.r.date),
      };
      if (cls === "missing") {
        Object.assign(ev, { rule: "missing_data", kind: "data", label: "Monitoring data unavailable",
          severity: 1, missingActual: run.filter((x) => x.r.actualKwh == null).length, missingBaseline: run.filter((x) => x.r.expectedKwh == null).length });
      } else {
        let a = 0, e = 0;
        run.forEach((x) => { a += x.r.actualKwh; e += x.r.expectedKwh; });
        Object.assign(ev, {
          rule: cls === "outage" ? "possible_outage" : "sustained_underperformance", kind: "production",
          label: cls === "outage" ? "Possible production outage, investigation required" : "Sustained underperformance detected",
          severity: cls === "outage" ? 3 : 2,
          actualKwh: round(a, 1), expectedKwh: round(e, 1), epi: round((a / e) * 100, 1), shortfallKwh: round(e - a, 1),
          ruleText: cls === "outage"
            ? `Rule 2: actual production at most ${RULES.OUTAGE_MAX_RATIO * 100}% of expected on days where expected was at least ${RULES.OUTAGE_MIN_YIELD} kWh per kWp.`
            : `Rule 1: EPI below ${RULES.UNDERPERF_EPI * 100}% for ${RULES.UNDERPERF_MIN_DAYS} or more consecutive eligible days (expected above ${RULES.UNDERPERF_MIN_YIELD} kWh per kWp).`,
        });
      }
      events.push(ev); run = [];
    };
    dayClass.forEach((x) => {
      if (x.cls === "none") { flush(); return; }
      if (run.length && run[0].cls !== x.cls) flush();
      run.push(x);
    });
    flush();
    events.forEach((ev) => Object.assign(ev, assessRecovery(ev, rs, cap)));
    return events;
  }

  /** Physical recovery is decided ONLY by valid measurements after the event, never by task status.
      Production event: RECOVERY_MIN_DAYS valid days with EPI >= the Rule 1 threshold. A valid day still below the
      threshold (on a day with meaningful expected yield) resets the count. Missing or invalid days, and
      low-irradiance days, are not evidence either way. Data event: RECOVERY_MIN_DAYS valid measurements resumed. */
  function assessRecovery(ev, siteRecordsSorted, capacityKwp) {
    let streak = 0;
    for (const r of siteRecordsSorted) {
      if (r.date <= ev.end || !isValidPair(r)) continue;
      if (ev.kind === "data") streak++;
      else if (r.actualKwh / r.expectedKwh >= RULES.UNDERPERF_EPI) streak++;
      else if (r.expectedKwh / capacityKwp > RULES.UNDERPERF_MIN_YIELD) streak = 0;
      if (streak >= RULES.RECOVERY_MIN_DAYS) return { recovered: true, recoveredOn: r.date };
    }
    return { recovered: false, recoveredOn: null };
  }

  /** Anomaly lifecycle, from data only. Active: not yet recovered. Recovered: recovered, overlaps the selected period.
      Historical: recovered, entirely before the selected period. */
  function lifecycleOf(ev, dates) {
    if (!ev.recovered) return "Active";
    const set = new Set(dates);
    return ev.dates.some((d) => set.has(d)) ? "Recovered" : "Historical";
  }

  /** Restrict an event's figures to the selected period. */
  function eventInPeriod(ev, records, dates, settings) {
    const price = (settings || DEFAULT_SETTINGS).energyValue;
    const set = new Set(dates);
    const inDates = ev.dates.filter((d) => set.has(d));
    if (!inDates.length) return null;
    const byDate = new Map(records.filter((r) => r.siteId === ev.siteId).map((r) => [r.date, r]));
    let a = 0, e = 0;
    inDates.forEach((d) => { const r = byDate.get(d); if (isValidPair(r)) { a += r.actualKwh; e += r.expectedKwh; } });
    return Object.assign({}, ev, {
      periodDays: inDates.length, periodActual: round(a, 1), periodExpected: round(e, 1),
      periodShortfall: round(Math.max(0, e - a), 1), periodValue: round(Math.max(0, e - a) * price, 2),
      periodEpi: e > 0 ? round((a / e) * 100, 1) : null,
    });
  }

  /** Maintenance state only: whether a linked work order is closed. Never used for anomaly or site status. */
  function isResolved(ev, tasks) {
    return (tasks || []).some((t) => t.anomalyId === ev.id && t.status === "Resolved");
  }
  /** The work order linked to an event (one per event; latest id if legacy duplicates exist). */
  function taskForEvent(eventId, tasks) {
    const linked = (tasks || []).filter((t) => eventId && t.anomalyId === eventId);
    return linked.length ? linked.sort((a, b) => (a.id < b.id ? 1 : -1))[0] : null;
  }
  /** A new work order may be created for an event only if none is linked yet; otherwise reopen the existing one. */
  function canCreateTask(eventId, tasks) { return !eventId || !taskForEvent(eventId, tasks); }

  /** Transparent ranking: active (not yet recovered) production anomalies, by shortfall value in period, then days,
      then severity. Task status does not affect ranking; `tasks` is kept in the signature for compatibility. */
  function rankAnomalies(periodEvents, tasks) {
    const prod = periodEvents.filter((e) => e.kind === "production" && !e.recovered);
    prod.sort((x, y) => (y.periodShortfall - x.periodShortfall) || (y.periodDays - x.periodDays) || (y.severity - x.severity));
    return prod.map((e, i) => Object.assign({}, e, {
      rank: i + 1,
      rankReason: i === 0
        ? `Priority 1: highest estimated production shortfall value among active production anomalies in the selected period (${e.periodShortfall.toLocaleString()} kWh over ${e.periodDays} day${e.periodDays === 1 ? "" : "s"}).`
        : `Priority ${i + 1}: ranked below ${prod[i - 1].siteId} because its shortfall in the period (${e.periodShortfall.toLocaleString()} kWh) is smaller (${prod[i - 1].periodShortfall.toLocaleString()} kWh). Secondary factors: ${e.periodDays} days, ${e.rule === "possible_outage" ? "outage" : "underperformance"} severity.`,
    }));
  }

  /** Rule 4 / Rule 5 / status column. */
  function siteStatus(metrics, siteEvents) {
    const activeData = siteEvents.some((e) => e.kind === "data");
    const activeProd = siteEvents.some((e) => e.kind === "production");
    if (metrics.coverage == null || metrics.coverage < RULES.INSUFFICIENT_COVERAGE)
      return { status: "Insufficient data", label: "Insufficient data for reliable performance assessment.", tone: "neutral" };
    if (activeProd) return { status: "Review", label: "Production anomaly flagged in this period.", tone: "warn" };
    if (activeData || metrics.coverage < 100) return { status: "Data Issue", label: "Monitoring data incomplete in this period.", tone: "info" };
    return { status: "Healthy", label: "Operating within expected range.", tone: "good" };
  }

  // ---------------------------------------------------------------- insight templates (deterministic, explainable)
  function money(v) { return "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function kwh(v) { return Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 }) + " kWh"; }

  function buildInsight(ctx) {
    // ctx: { site, metrics (period), event (periodEvent or null), status, settings }
    const { site, metrics: m, event: e, status, settings } = ctx;
    const price = (settings || DEFAULT_SETTINGS).energyValue;
    const base = { dataLimits: [] };
    if (m.coverage != null && m.coverage < 100) base.dataLimits.push(`Data coverage is ${m.coverage}% (${m.validDays} of ${m.eligibleDays} eligible days have both a measurement and a baseline). Missing days are excluded from every figure above and are never counted as zero production.`);
    base.dataLimits.push("Expected generation is the supplied baseline (demo: synthetic baseline). If the baseline is wrong, EPI and shortfall are wrong with it. Confirm the baseline source before acting.");
    base.dataLimits.push("Daily energy totals cannot show which inverter, string or module is responsible, and cannot confirm a physical cause. Inverter event logs or alarms are needed for that.");

    if (status.status === "Insufficient data") return Object.assign(base, {
      headline: "Insufficient data for reliable performance assessment",
      observation: `Only ${m.validDays} of ${m.eligibleDays} eligible days in this period have both a measurement and a baseline (${m.coverage == null ? "0" : m.coverage}% coverage). That is below the ${RULES.INSUFFICIENT_COVERAGE}% threshold for a reliable assessment.`,
      evidence: `Valid days: ${m.validDays}. Missing measurements: ${m.missingActual}. Missing baseline: ${m.missingBaseline}.`,
      exposure: "Not estimated. SolarOps does not estimate energy loss from missing readings.",
      explanations: ["Monitoring gateway or network outage", "Data logger or portal export problem", "Site reporting not yet configured for this period"],
      nextStep: "Restore the data feed or import the missing days, then re-run the assessment. Do not schedule physical maintenance on this evidence alone.",
    });

    if (e && e.kind === "production" && !e.ongoing && !e.recovered) base.dataLimits.unshift(`Recovery not yet confirmed. The rule condition stopped after ${fmtDate(e.end)}, but SolarOps needs ${RULES.RECOVERY_MIN_DAYS} valid days at or above ${RULES.UNDERPERF_EPI * 100}% of expected before treating the site as recovered.`);
    if (e && e.rule === "possible_outage") return Object.assign(base, {
      headline: e.label,
      observation: `Measured production was near zero (${e.periodEpi}% of expected) for ${e.periodDays} consecutive day${e.periodDays === 1 ? "" : "s"} from ${fmtDate(e.start)}${e.ongoing ? ", and the condition is still present in the latest data" : " to " + fmtDate(e.end)}, while the expected baseline for those days was substantial.`,
      evidence: `Actual: ${kwh(e.periodActual)}. Expected: ${kwh(e.periodExpected)}. Average expected per kWp on those days: ${round(e.periodExpected / e.periodDays / site.capacityKwp, 2)} kWh/kWp (rule threshold ${RULES.OUTAGE_MIN_YIELD}). ${e.ruleText}`,
      exposure: `Observed energy shortfall vs baseline: ${kwh(e.periodShortfall)}. Estimated shortfall value: ${money(e.periodValue)} at an assumed $${price.toFixed(2)}/kWh. This is an illustrative proxy for the period, not verified lost revenue.`,
      explanations: ["Inverter or AC disconnect trip (site offline)", "Utility or interconnection outage", "Meter or communications fault reporting zero while the site produces", "Planned shutdown not recorded in SolarOps"],
      nextStep: "Confirm with the inverter portal or on-site whether the system is actually offline. If it is, attempt a remote reset where supported, then dispatch a technician. If production is fine on site, treat this as a monitoring fault.",
    });

    if (e && e.rule === "sustained_underperformance") return Object.assign(base, {
      headline: e.label,
      observation: `Generation was ${round(100 - e.periodEpi, 0)}% below the supplied expected baseline during ${e.periodDays} consecutive valid reporting day${e.periodDays === 1 ? "" : "s"} starting ${fmtDate(e.start)}${e.ongoing ? ", and the pattern continues in the latest data" : ", ending " + fmtDate(e.end)}.`,
      evidence: `Actual: ${kwh(e.periodActual)}. Expected: ${kwh(e.periodExpected)}. EPI over the event: ${e.periodEpi}%. Valid data coverage in the period: ${m.coverage}%. ${e.ruleText}`,
      exposure: `Observed energy shortfall vs baseline: ${kwh(e.periodShortfall)}. Estimated shortfall value: ${money(e.periodValue)} at an assumed $${price.toFixed(2)}/kWh. Illustrative proxy only; actual tariff or PPA terms may differ.`,
      explanations: ["One or more inverters or strings offline (partial availability)", "Soiling, shading or module damage reducing DC output", "Inverter derating or clipping settings changed", "Weather-baseline mismatch (baseline too optimistic for the period)", "Meter or monitoring measurement error"],
      nextStep: "Review inverter fault logs and per-inverter output for the event dates, confirm meter readings against the utility, and verify the expected-generation baseline before scheduling physical maintenance.",
    });

    if (e && e.rule === "missing_data") return Object.assign(base, {
      headline: e.label,
      observation: `No production measurement was received for ${e.periodDays} day${e.periodDays === 1 ? "" : "s"} starting ${fmtDate(e.start)}${e.ongoing ? " and the feed has not resumed" : ""}.`,
      evidence: `Missing measurements: ${e.missingActual}. Missing baselines: ${e.missingBaseline}. These days are excluded from EPI, shortfall and financial figures.`,
      exposure: "Not estimated. A missing reading is not evidence that the site stopped producing.",
      explanations: ["Monitoring gateway or cellular/network outage", "Portal export or API failure", "Data logger power loss"],
      nextStep: "Check the monitoring gateway and portal, then import the missing days once available. If the site was actually down, the imported data will show it.",
    });

    return Object.assign(base, {
      headline: "Operating within expected range",
      observation: `Over ${m.validDays} valid day${m.validDays === 1 ? "" : "s"}, generation was ${m.epi}% of the expected baseline with no rule-based anomaly triggered.`,
      evidence: `Actual: ${kwh(m.actualKwh)}. Expected: ${kwh(m.expectedKwh)}. Coverage: ${m.coverage}%.`,
      exposure: m.shortfallKwh > 0 ? `Ordinary day-to-day variation below baseline sums to ${kwh(m.shortfallKwh)} (${money(m.shortfallValue)} at $${price.toFixed(2)}/kWh). This is normal scatter, not a flagged problem.` : "No shortfall against baseline in this period.",
      explanations: [],
      nextStep: "No investigation recommended. Continue routine monitoring.",
    });
  }

  // ---------------------------------------------------------------- tasks
  function newTaskId(existing) {
    const n = (existing || []).reduce((mx, t) => Math.max(mx, parseInt(String(t.id).replace(/\D/g, ""), 10) || 0), 0) + 1;
    return "INV-" + String(n).padStart(3, "0");
  }
  function defaultPriority(rankedEvent) {
    if (!rankedEvent) return "Medium";
    if (rankedEvent.rule === "possible_outage") return "Critical";
    if (rankedEvent.rank === 1) return "High";
    return "Medium";
  }
  function seedTasks(records) {
    // One resolved investigation for the historical, recovered event at FLL-05, so history is populated.
    const fll = SITES.find((s) => s.id === "FLL-05");
    const ev = detectAnomalies(records, fll).find((e) => e.rule === "sustained_underperformance");
    if (!ev) return [];
    return [{
      id: "INV-001", siteId: "FLL-05", anomalyId: ev.id,
      title: "Sustained underperformance at Cypress Creek Office Complex",
      description: `EPI ${ev.epi}% over ${ev.days} days (${fmtDate(ev.start)} to ${fmtDate(ev.end)}). Shortfall ${kwh(ev.shortfallKwh)}.`,
      priority: "High", assignee: "Devin Carter (field tech)", status: "Resolved",
      createdAt: addDays(ev.start, 2), resolvedAt: addDays(ev.end, 1), estimatedCost: 650,
      shortfallKwh: ev.shortfallKwh,
      notes: [
        { date: addDays(ev.start, 2), text: "Portal shows inverter 2 of 3 in standby since the event start. Remote reset did not clear it." },
        { date: addDays(ev.start, 6), text: "Site visit: blown DC fuse on inverter 2 string 3, replaced. Inverter back online." },
        { date: addDays(ev.end, 1), text: "Production back within baseline for 2 days. Closing." },
      ],
    }];
  }

  // ---------------------------------------------------------------- CSV import
  const REQUIRED_COLS = ["date", "site_id", "actual_kwh", "expected_kwh"];
  const OPTIONAL_COLS = ["inverter_id", "alarm_code", "data_source"];
  function parseCSV(text) {
    const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim().length);
    if (!lines.length) return { header: [], rows: [] };
    const split = (l) => l.split(",").map((c) => c.trim().replace(/^"|"$/g, ""));
    const header = split(lines[0]).map((h) => h.toLowerCase());
    const rows = lines.slice(1).map(split);
    return { header, rows };
  }
  /** Validate parsed CSV. Returns { ok, errors[], records[], warnings[], duplicatesWithin, existingKeys } */
  function validateImport(text, knownSiteIds, existingRecords) {
    const { header, rows } = parseCSV(text);
    const errors = [], warnings = [], records = [];
    const missing = REQUIRED_COLS.filter((c) => !header.includes(c));
    if (missing.length) return { ok: false, errors: [`Missing required column${missing.length > 1 ? "s" : ""}: ${missing.join(", ")}. Expected header: ${REQUIRED_COLS.join(",")}`], records: [], warnings: [] };
    const idx = (c) => header.indexOf(c);
    const seen = new Set(); let dupWithin = 0;
    const existing = new Set((existingRecords || []).map((r) => r.siteId + "|" + r.date));
    let overwrites = 0;
    rows.forEach((cells, i) => {
      const line = i + 2;
      const date = cells[idx("date")], siteId = (cells[idx("site_id")] || "").toUpperCase();
      const aRaw = cells[idx("actual_kwh")], eRaw = cells[idx("expected_kwh")];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "") || isNaN(parseISO(date).getTime()) || toISO(parseISO(date)) !== date) { errors.push(`Line ${line}: invalid date "${date}". Use a real calendar date in YYYY-MM-DD format.`); return; }
      if (!knownSiteIds.includes(siteId)) { errors.push(`Line ${line}: unknown site_id "${siteId}". Known sites: ${knownSiteIds.join(", ")}.`); return; }
      const parseNum = (raw, name) => {
        if (raw === undefined || raw === "" || raw.toLowerCase() === "na" || raw.toLowerCase() === "null") return null;
        const v = Number(raw);
        if (!Number.isFinite(v)) { errors.push(`Line ${line}: ${name} "${raw}" is not a number.`); return undefined; }
        if (v < 0) { errors.push(`Line ${line}: ${name} is negative (${raw}). Energy cannot be negative.`); return undefined; }
        return v;
      };
      const a = parseNum(aRaw, "actual_kwh"), e = parseNum(eRaw, "expected_kwh");
      if (a === undefined || e === undefined) return;
      const key = siteId + "|" + date;
      if (seen.has(key)) { dupWithin++; errors.push(`Line ${line}: duplicate of an earlier line for ${siteId} on ${date}.`); return; }
      seen.add(key);
      if (existing.has(key)) overwrites++;
      let quality = "valid";
      if (a == null && e == null) quality = "missing_actual";
      else if (a == null) quality = "missing_actual";
      else if (e == null) { quality = "missing_baseline"; warnings.push(`Line ${line}: no expected_kwh. Stored as raw production with "Baseline unavailable".`); }
      records.push({
        siteId, date, actualKwh: a, expectedKwh: e, quality,
        dataSource: cells[idx("data_source")] || "csv_import", baselineSource: e == null ? "none" : "csv_import",
        inverterId: idx("inverter_id") >= 0 ? cells[idx("inverter_id")] || null : null,
        alarmCode: idx("alarm_code") >= 0 ? cells[idx("alarm_code")] || null : null,
      });
    });
    return { ok: errors.length === 0, errors, warnings, records, duplicatesWithin: dupWithin, overwrites, header, rowCount: rows.length };
  }
  function sampleCSV() {
    const d = addDays(DEMO_END, 1);
    return [
      "date,site_id,actual_kwh,expected_kwh,inverter_id,alarm_code,data_source",
      `${d},MIA-01,1842.5,1910.2,,,portal_export`,
      `${d},ORL-02,702.1,955.4,,,portal_export`,
      `${d},TPA-03,38.0,2860.7,INV-1,E-104,portal_export`,
      `${d},JAX-04,,1230.0,,,portal_export`,
      `${d},FLL-05,598.3,601.9,,,portal_export`,
      `${d},WPB-06,371.6,359.0,,,portal_export`,
    ].join("\n");
  }

  // ---------------------------------------------------------------- top-level compute (one source of truth for the UI)
  function compute(state) {
    // state: { records (merged), tasks, settings, periodDays, endDate, sites? (defaults to the demo SITES) }
    const settings = state.settings || DEFAULT_SETTINGS;
    const sites = state.sites || SITES;
    const endDate = state.endDate || DEMO_END;
    const dates = periodDates(endDate, state.periodDays || 30);
    const perSite = {};
    const allPeriodEvents = [];
    sites.forEach((site) => {
      const siteSettings = Object.assign({}, settings, { energyValue: priceFor(site, settings) });
      const metrics = siteMetrics(state.records, site, dates, settings);
      const events = detectAnomalies(state.records, site);
      events.forEach((e) => { e.lifecycle = lifecycleOf(e, dates); });
      const periodEvents = events.map((e) => eventInPeriod(e, state.records, dates, siteSettings)).filter(Boolean);
      const status = siteStatus(metrics, periodEvents.filter((e) => e.kind === "production" ? !e.recovered : true));
      const historicalEvents = events.filter((e) => e.lifecycle === "Historical");
      perSite[site.id] = { site, metrics, events, periodEvents, historicalEvents, status };
      allPeriodEvents.push(...periodEvents);
    });
    const ranked = rankAnomalies(allPeriodEvents, state.tasks);
    const rankById = new Map(ranked.map((r) => [r.id, r]));
    Object.values(perSite).forEach((ps) => {
      ps.periodEvents = ps.periodEvents.map((e) => rankById.get(e.id) || e);
      ps.rank = ps.periodEvents.reduce((best, e) => (e.rank && (!best || e.rank < best) ? e.rank : best), null);
      const primary = ps.periodEvents.filter((e) => e.kind === "production" && !e.recovered).sort((a, b) => (a.rank || 99) - (b.rank || 99))[0]
        || ps.periodEvents.find((e) => e.kind === "data") || null;
      ps.primaryEvent = primary;
      ps.insight = buildInsight({ site: ps.site, metrics: ps.metrics, event: primary, status: ps.status, settings: Object.assign({}, settings, { energyValue: priceFor(ps.site, settings) }) });
    });
    const portfolio = portfolioMetrics(Object.values(perSite).map((p) => p.metrics), settings);
    const dataIssues = allPeriodEvents.filter((e) => e.kind === "data");
    return { dates, settings, perSite, ranked, dataIssues, portfolio,
      openTasks: (state.tasks || []).filter((t) => t.status !== "Resolved").length,
      totalCapacity: sites.reduce((s, x) => s + x.capacityKwp, 0) };
  }

  return {
    DEMO_END, DEMO_DAYS, DEFAULT_SETTINGS, RULES, STATUSES, PRIORITIES, TEAM, SITES, REQUIRED_COLS, OPTIONAL_COLS,
    toISO, parseISO, addDays, daysBetween, periodDates, priceFor, fmtDate, fmtDateLong, round, money, kwh,
    generateDemoRecords, mergeRecords, isValidPair,
    siteMetrics, portfolioMetrics, detectAnomalies, eventInPeriod, rankAnomalies, siteStatus, isResolved, buildInsight,
    assessRecovery, lifecycleOf, taskForEvent, canCreateTask,
    newTaskId, defaultPriority, seedTasks, parseCSV, validateImport, sampleCSV, compute,
  };
});

<script>
/* SolarOps data-access layer (Supabase). Pure I/O and shape mapping; no analytics here.
   The analytics engine (core.js) only ever sees plain objects in its own shape:
     site   { id: site_code, uuid, name, type, city, state, capacityKwp, inverter, commissioned, energyValue }
     record { siteId: site_code, date, actualKwh, expectedKwh, dataSource, baselineSource, quality }
     task   { id: "INV-001", uuid, siteId, anomalyId: event key, title, ..., notes: [{date, text}] }
   Works in the browser (window.SolarOpsData) and in Node tests (module.exports). */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.SolarOpsData = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  const FN = "solarops-api";
  const RULE_CLASS = { possible_outage: "outage", sustained_underperformance: "under", missing_data: "missing" };
  const EXTERNAL = "External contractor";
  const UNASSIGNED = "Unassigned";

  const num = (v) => (v === null || v === undefined ? null : Number(v));
  const pad3 = (n) => String(n).padStart(3, "0");
  const dateOnly = (ts) => (ts ? String(ts).slice(0, 10) : null);
  function check(res, what) {
    if (res.error) { const e = new Error((what ? what + ": " : "") + (res.error.message || String(res.error))); e.cause = res.error; throw e; }
    return res.data;
  }
  async function all(buildQuery, pageSize) {
    const size = pageSize || 1000, out = [];
    for (let from = 0; ; from += size) {
      const page = check(await buildQuery().range(from, from + size - 1));
      out.push(...page);
      if (page.length < size) break;
    }
    return out;
  }

  // ---------------------------------------------------------------- mapping (pure, unit-tested)
  function mapSite(row) {
    return {
      id: row.site_code, uuid: row.id, name: row.name, type: row.site_type || "Solar site",
      city: row.city || "", state: row.state || "", capacityKwp: Number(row.capacity_kwp),
      inverter: row.inverter_manufacturer || "Not specified", commissioned: row.commissioning_date,
      energyValue: row.electricity_value_per_kwh == null ? null : Number(row.electricity_value_per_kwh),
    };
  }
  function mapRecord(row, codeByUuid) {
    return {
      siteId: codeByUuid[row.site_id], date: row.measurement_date,
      actualKwh: num(row.actual_kwh), expectedKwh: num(row.expected_kwh),
      dataSource: row.data_source, baselineSource: row.baseline_source, quality: row.quality_status,
    };
  }
  function anomalyKey(row, codeByUuid) { return codeByUuid[row.site_id] + ":" + RULE_CLASS[row.anomaly_type] + ":" + row.start_date; }
  function memberLabel(m) { return (m.full_name && m.full_name.trim()) || "Member " + String(m.user_id).slice(0, 4); }
  function mapTask(row, ctx) {
    const assignee = row.assignee_id ? (ctx.memberById[row.assignee_id] ? memberLabel(ctx.memberById[row.assignee_id]) : "Former member")
      : row.external_assignee ? row.external_assignee : UNASSIGNED;
    return {
      id: "INV-" + pad3(row.task_number), uuid: row.id, taskNumber: row.task_number,
      siteId: ctx.codeByUuid[row.site_id], anomalyId: row.anomaly_id ? ctx.keyByAnomalyUuid[row.anomaly_id] || null : null,
      anomalyUuid: row.anomaly_id, title: row.title, description: row.description || "", priority: row.priority,
      assignee, status: row.status, createdAt: dateOnly(row.created_at), resolvedAt: dateOnly(row.resolved_at),
      estimatedCost: row.estimated_cost == null ? null : Number(row.estimated_cost),
      shortfallKwh: num(row.shortfall_kwh_at_creation), shortfallValue: num(row.shortfall_value_at_creation),
      notes: (ctx.notesByTask[row.id] || []).map((n) => ({ date: dateOnly(n.created_at), text: n.note, author: n.author_id })),
    };
  }
  /** UI task patch -> database columns. Notes are handled separately (append-only table). */
  function taskPatchToRow(patch, team) {
    const row = {};
    if ("title" in patch) row.title = patch.title;
    if ("description" in patch) row.description = patch.description;
    if ("priority" in patch) row.priority = patch.priority;
    if ("status" in patch) row.status = patch.status;           // resolved_at is maintained by the database trigger
    if ("estimatedCost" in patch) row.estimated_cost = patch.estimatedCost === "" ? null : patch.estimatedCost;
    if ("assignee" in patch) {
      const m = (team.members || []).find((x) => memberLabel(x) === patch.assignee);
      if (m) { row.assignee_id = m.user_id; row.external_assignee = null; }
      else if (!patch.assignee || patch.assignee === UNASSIGNED) { row.assignee_id = null; row.external_assignee = null; }
      else { row.assignee_id = null; row.external_assignee = patch.assignee; }
    }
    return row;
  }
  function recordToRow(rec, orgId, uuidByCode) {
    return {
      organization_id: orgId, site_id: uuidByCode[rec.siteId], measurement_date: rec.date,
      actual_kwh: rec.actualKwh, expected_kwh: rec.expectedKwh,
      data_source: "csv_import",                                   // only client-writable sources are allowed by RLS
      baseline_source: rec.expectedKwh == null ? "none" : "csv_import",
      inverter_id: rec.inverterId || null, alarm_code: rec.alarmCode || null,
    };
  }
  function siteToRow(site, orgId) {
    const row = {
      site_code: String(site.code || site.id || "").trim().toUpperCase(), name: String(site.name || "").trim(),
      site_type: site.type || null, city: site.city || null, state: site.state || null,
      capacity_kwp: Number(site.capacityKwp), inverter_manufacturer: site.inverter || null,

    };

  }
  /** Demo organization layout: the six demo sites, each fed by the MOCK connector with a scenario relative to "yesterday". */
  function demoMappings(sites, yesterday, addDays) {
    const plan = {
      "MIA-01": "MOCK:healthy",
      "ORL-02": "MOCK:under:" + addDays(yesterday, -11),
      "TPA-03": "MOCK:outage:" + addDays(yesterday, -3),
      "JAX-04": "MOCK:gap:" + addDays(yesterday, -6) + ":4",
      "FLL-05": "MOCK:recovered:" + addDays(yesterday, -59) + ":9",
      "WPB-06": "MOCK:variable",

  }

  // ---------------------------------------------------------------- session & organizations
  async function loadIdentity(sb) {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return null;
    const profile = check(await sb.from("profiles").select("id, full_name, organization_id").eq("id", user.id).maybeSingle(), "profile");
    const memberships = check(await sb.from("organization_members").select("organization_id, role, organizations(id, name, is_demo)").eq("user_id", user.id), "memberships");
    return { user, profile, memberships };
  }
  async function createOrganization(sb, name, isDemo) {
    return check(await sb.rpc("create_organization", { p_name: name, p_is_demo: !!isDemo }), "create organization");
  }
  async function switchOrganization(sb, userId, orgId) {
    check(await sb.from("profiles").update({ organization_id: orgId }).eq("id", userId), "switch organization");
  }

  // ---------------------------------------------------------------- workspace load (everything the dashboard needs)
  async function loadWorkspace(sb, orgId) {
    const [org, settingsRow, siteRows, memberRows, connRows, mapRows, runRows] = await Promise.all([
      sb.from("organizations").select("id, name, is_demo").eq("id", orgId).single().then((r) => check(r, "organization")),
      sb.from("organization_settings").select("*").eq("organization_id", orgId).single().then((r) => check(r, "settings")),
      sb.from("solar_sites").select("*").eq("organization_id", orgId).order("site_code").then((r) => check(r, "sites")),
      sb.from("organization_members").select("user_id, role").eq("organization_id", orgId).then((r) => check(r, "members")),
      sb.from("monitoring_connections").select("id, provider, display_name, connection_status, last_successful_sync, last_sync_attempt, last_error, created_at").eq("organization_id", orgId).order("created_at").then((r) => check(r, "connections")),
      sb.from("monitoring_connection_sites").select("connection_id, site_id, external_site_id").eq("organization_id", orgId).then((r) => check(r, "connection sites")),
      sb.from("sync_runs").select("id, connection_id, trigger_source, status, started_at, finished_at, window_start, window_end, records_received, records_inserted, records_updated, records_unchanged, records_rejected, rejection_reasons, sites_analyzed, error").eq("organization_id", orgId).order("started_at", { ascending: false }).limit(10).then((r) => check(r, "sync runs")),
    ]);

    const profileRows = userIds.length ? check(await sb.from("profiles").select("id, full_name").in("id", userIds), "member profiles") : [];
    const nameById = Object.fromEntries(profileRows.map((p) => [p.id, p.full_name]));
    const members = memberRows.map((m) => ({ user_id: m.user_id, role: m.role, full_name: nameById[m.user_id] || null }));

    const [recordRows, anomalyRows, taskRows, noteRows] = await Promise.all([
      all(() => sb.from("production_records").select("site_id, measurement_date, actual_kwh, expected_kwh, data_source, baseline_source, quality_status").eq("organization_id", orgId).order("measurement_date").order("site_id")),
      all(() => sb.from("anomalies").select("*").eq("organization_id", orgId).order("start_date")),
      all(() => sb.from("maintenance_tasks").select("*").eq("organization_id", orgId).order("task_number")),
      all(() => sb.from("maintenance_notes").select("id, task_id, author_id, note, created_at").eq("organization_id", orgId).order("created_at")),
    ]);

    const sites = siteRows.map(mapSite);
    const codeByUuid = Object.fromEntries(siteRows.map((s) => [s.id, s.site_code]));
    const uuidByCode = Object.fromEntries(siteRows.map((s) => [s.site_code, s.id]));

      const key = anomalyKey(a, codeByUuid);

    const notesByTask = {};

    const tasks = taskRows.map((t) => mapTask(t, { codeByUuid, keyByAnomalyUuid, memberById, notesByTask }));

  }

  // ---------------------------------------------------------------- server analysis & sync (Edge Function)
  async function invoke(sb, body) {

        await analyze(sb, ws.org.id, [ws.uuidByCode[data.siteId]]);

      title: data.title, description: data.description || null, priority: data.priority || "Medium", status: "Open",
      shortfall_kwh_at_creation: data.shortfallKwh == null ? null : data.shortfallKwh,

  async function updateTask(sb, taskUuid, patch, team) {

  }
  async function addNote(sb, orgId, taskUuid, text) {

  async function deleteTask(sb, taskUuid) { check(await sb.from("maintenance_tasks").delete().eq("id", taskUuid), "delete task"); }
  async function importRecords(sb, ws, recs, policy) {

    for (let i = 0; i < rows.length; i += 500) {
      check(await sb.from("production_records").upsert(rows.slice(i, i + 500), { onConflict: "site_id,measurement_date", ignoreDuplicates: policy === "skip" }), "import");
    }
    const siteUuids = [...new Set(rows.map((r) => r.site_id))];
    return analyze(sb, ws.org.id, siteUuids);
  }
  async function updateSettings(sb, orgId, patch) {
    const row = {};
    if ("energyValue" in patch) row.default_electricity_value = patch.energyValue;
    if ("defaultPeriodDays" in patch) row.default_period_days = patch.defaultPeriodDays;
    return check(await sb.from("organization_settings").update(row).eq("organization_id", orgId).select("*").single(), "settings");
  }
  async function saveSite(sb, orgId, site) {
    if (site.uuid) return check(await sb.from("solar_sites").update(siteToRow(site, null)).eq("id", site.uuid).select("*").single(), "update site");
    return check(await sb.from("solar_sites").insert(siteToRow(site, orgId)).select("*").single(), "create site");
  }
  async function seedDemoOrganization(sb, orgId, C) {
    const siteRows = C.SITES.map((s) => siteToRow({ code: s.id, name: s.name, type: s.type, city: s.city, state: s.state, capacityKwp: s.capacityKwp, inverter: s.inverter, commissioned: s.commissioned }, orgId));
    const inserted = check(await sb.from("solar_sites").insert(siteRows).select("id, site_code"), "demo sites");
    const conn = check(await sb.from("monitoring_connections").insert({ organization_id: orgId, provider: "mock", display_name: "Mock monitoring API (synthetic)" }).select("id").single(), "mock connection");
    const yesterday = C.addDays(C.toISO(new Date()), -1);
    const byCode = Object.fromEntries(inserted.map((r) => [r.site_code, r.id]));
    const maps = demoMappings(C.SITES, yesterday, C.addDays).map((m) => ({ organization_id: orgId, connection_id: conn.id, site_id: byCode[m.code], external_site_id: m.external }));
    check(await sb.from("monitoring_connection_sites").insert(maps), "connection sites");
    return syncConnection(sb, conn.id);
  }

  return {
    RULE_CLASS, EXTERNAL, UNASSIGNED,
    mapSite, mapRecord, mapTask, anomalyKey, memberLabel, taskPatchToRow, recordToRow, siteToRow, demoMappings,
    loadIdentity, createOrganization, switchOrganization, loadWorkspace,
    analyze, syncConnection, createTask, updateTask, addNote, deleteTask, importRecords, updateSettings, saveSite, seedDemoOrganization,
  };
});

<script type="text/babel" data-presets="react">
/* SolarOps v2 UI. All numbers come from SolarOpsCore.compute(); this file only renders and edits state.
   Two interchangeable stores feed the same Workspace: a local demo store (synthetic data, browser storage)

const { useState, useEffect, useMemo, useRef, useCallback, useContext } = React;

}

}

const TONE_BY_RULE = { possible_outage: "crit", sustained_underperformance: "warn", missing_data: "info" };

const PRIORITY_TONE = { Critical: "crit", High: "warn", Medium: "info", Low: "neutral" };
